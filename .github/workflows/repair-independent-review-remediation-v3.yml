name: Repair independent review remediation v3
on:
  push:
    branches:
      - feat/v0.1.2-stable-install-cloudflare
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Run clean remediation v3'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.1.2-stable-install-cloudflare
          fetch-depth: 0
      - name: Apply and validate
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/repair.log) 2>&1
          export GOTOOLCHAIN=go1.26.0
          go version
          go version | grep -Fq 'go1.26.0' || { echo 'repair validation requires Go 1.26.0' >&2; exit 1; }
          cat scripts/.tmp-irfix-part00 scripts/.tmp-irfix-part01 > scripts/.tmp-independent-review-fix.py
          sed 's/--argjson port "$CF_COMMIT_PORT"/--arg commit_port "$CF_COMMIT_PORT"/' scripts/.tmp-irfix-part02 >> scripts/.tmp-independent-review-fix.py
          sed -n '5,$p' scripts/.tmp-irfix-part03 | sed '1s/^cf_reset_transaction_globals(){//' >> scripts/.tmp-independent-review-fix.py
          cat scripts/.tmp-irfix-part04 >> scripts/.tmp-independent-review-fix.py
          sed -n '1,63p' scripts/.tmp-irfix-part05 >> scripts/.tmp-independent-review-fix.py
          cat scripts/.tmp-independent-review-tail-clean.py >> scripts/.tmp-independent-review-fix.py
          python3 -m py_compile scripts/.tmp-independent-review-fix.py
          python3 scripts/.tmp-independent-review-fix.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/cloudflare_transaction.sh')
          t = p.read_text()
          old = r'http.host eq \\"mcp.example.com\\"'
          new = r'http.host eq \"mcp.example.com\"'
          count = t.count(old)
          if count != 3:
              raise SystemExit(f'expected exactly three doubled-escape SSL fixtures, found {count}')
          t = t.replace(old, new)
          capture = 'ORIG_CF_GET_OPTIONAL="$(declare -f cf_get_optional)"\n'
          capture_new = capture + 'ORIG_CF_RECONCILE_SSL_CONFIG_RULE="$(declare -f cf_reconcile_ssl_config_rule)"\n'
          if t.count(capture) != 1:
              raise SystemExit('expected exactly one real-helper capture anchor')
          t = t.replace(capture, capture_new, 1)
          restore = 'eval "$ORIG_CF_GET_OPTIONAL"\n\n# Same-host canonical owned SSL rule is a no-op'
          restore_new = 'eval "$ORIG_CF_GET_OPTIONAL"\neval "$ORIG_CF_RECONCILE_SSL_CONFIG_RULE"\n\n# Same-host canonical owned SSL rule is a no-op'
          if t.count(restore) != 1:
              raise SystemExit('expected exactly one SSL reconcile restore anchor')
          t = t.replace(restore, restore_new, 1)
          p.write_text(t)

          p = Path('tests/cloudflare_crash_recovery.sh')
          t = p.read_text()
          anchor = 'CF_TXN_BACKUP_DIR="$TEST_CONTROL_DIR/cloudflare-transaction-backup"'
          replacement = anchor + '; MANAGEMENT_LOCK="$TEST_CONTROL_DIR/management.lock"; MANAGEMENT_LOCK_FD=""'
          count = t.count(anchor)
          if count != 2:
              raise SystemExit(f'expected two crash-recovery temp-path anchors, found {count}')
          p.write_text(t.replace(anchor, replacement))

          p = Path('tests/cloudflare_phase_recovery.sh')
          t = p.read_text()
          anchor = '      cf_recover_pending_write(){ cf_clear_pending_write; return 0; }\n      recover_cloudflare_transaction'
          replacement = (
              '      cf_recover_pending_write(){ cf_clear_pending_write; return 0; }\n'
              '      if [ -s "$CF_TXN_STATE" ]; then\n'
              '        load_cloudflare_transaction_globals\n'
              '        if [ "$CF_TXN_PHASE" = committing ] || [ "$CF_TXN_PHASE" = committed ]; then\n'
              '          printf "phase-debug globals host=<%s> port=<%s> zone_id=<%s> zone_name=<%s> dns_id=<%s> dns_owned=<%s> origin_set=<%s> origin_rule=<%s> ssl_set=<%s> ssl_rule=<%s> cert=<%s>\\n" "$CF_COMMIT_HOST" "$CF_COMMIT_PORT" "$CF_COMMIT_ZONE_ID" "$CF_COMMIT_ZONE_NAME" "$CF_COMMIT_DNS_ID" "$CF_COMMIT_DNS_OWNED" "$CF_COMMIT_ORIGIN_RULESET_ID" "$CF_COMMIT_ORIGIN_RULE_ID" "$CF_COMMIT_SSL_RULESET_ID" "$CF_COMMIT_SSL_RULE_ID" "$CF_COMMIT_CERT_ID" >&2\n'
              '          printf "phase-debug fingerprints dns=<%s> origin=<%s> ssl=<%s>\\n" "${CF_COMMIT_DNS_FINGERPRINT-UNSET}" "${CF_COMMIT_ORIGIN_FINGERPRINT-UNSET}" "${CF_COMMIT_SSL_FINGERPRINT-UNSET}" >&2\n'
              '          if managed_state_matches_transaction_commit; then\n'
              '            echo "phase-debug managed-match=true phase=$CF_TXN_PHASE" >&2\n'
              '          else\n'
              '            echo "phase-debug managed-match=false phase=$CF_TXN_PHASE" >&2\n'
              '            jq -c ".commit" "$CF_TXN_STATE" >&2 || true\n'
              '            jq -c "." "$MANAGED_STATE" >&2 || true\n'
              '            stat -c "%u:%g:%a %s" "$MANAGED_STATE" >&2 || true\n'
              '          fi\n'
              '        fi\n'
              '      fi\n'
              '      recover_cloudflare_transaction\n'
              '      if [ -s "$TEST_DELETE_LOG" ]; then echo "phase-debug deletes:" >&2; cat "$TEST_DELETE_LOG" >&2; fi'
          )
          if t.count(anchor) != 1:
              raise SystemExit(f'expected one phase recovery diagnostic anchor, found {t.count(anchor)}')
          p.write_text(t.replace(anchor, replacement, 1))
          PY
          chmod +x tests/cloudflare_transaction.sh tests/cloudflare_crash_recovery.sh tests/cloudflare_phase_recovery.sh
          bash -n manage.sh tests/cloudflare_transaction.sh tests/cloudflare_crash_recovery.sh tests/cloudflare_phase_recovery.sh
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f) }' scripts/.tmp-ci.yml scripts/.tmp-release.yml scripts/.tmp-security.yml
          sudo bash -x tests/cloudflare_phase_recovery.sh
          go test -race ./...
          cp tests/cloudflare_transaction.sh tests/.tmp-debug-cloudflare-transaction.sh
          sed -i 's/configure_cloudflare >\/dev\/null 2>\&1/configure_cloudflare/' tests/.tmp-debug-cloudflare-transaction.sh
          sudo bash -x tests/.tmp-debug-cloudflare-transaction.sh
          rm -f tests/.tmp-debug-cloudflare-transaction.sh
          sudo bash tests/cloudflare_transaction.sh
          sudo bash tests/cloudflare_crash_recovery.sh
          sudo bash tests/cloudflare_phase_recovery.sh
          grep -qF -- '--verify-tag' scripts/.tmp-release.yml
          if grep -qF -- '--target "$RELEASE_SHA"' scripts/.tmp-release.yml; then
            echo 'release workflow still uses unsafe --target' >&2
            exit 1
          fi
          grep -qF 'rulesets?targets=tag&includes_parents=true' scripts/.tmp-release.yml
          grep -qF 'flock -n "$MANAGEMENT_LOCK_FD"' manage.sh
          grep -qF 'committed journal finalized with mismatched managed state' tests/cloudflare_phase_recovery.sh
          git diff --check
      - name: Upload repair log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: repair-debug-${{ github.run_id }}
          path: |
            /tmp/repair.log
            manage.sh
            tests/cloudflare_phase_recovery.sh
          if-no-files-found: error
      - name: Commit validated non-workflow changes
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/.tmp-independent-review-fix.py tests/.tmp-debug-cloudflare-transaction.sh
          git rm scripts/.tmp-irfix-part00 scripts/.tmp-irfix-part01 scripts/.tmp-irfix-part02 scripts/.tmp-irfix-part03 scripts/.tmp-irfix-part04 scripts/.tmp-irfix-part05 scripts/.tmp-irfix-part06 scripts/.tmp-repair-trigger2 scripts/.tmp-independent-review-tail-clean.py
          git add manage.sh tests/cloudflare_transaction.sh tests/cloudflare_crash_recovery.sh tests/cloudflare_phase_recovery.sh README.md docs/ARCHITECTURE.md scripts/.tmp-ci.yml scripts/.tmp-release.yml scripts/.tmp-security.yml
          git diff --cached --check
          git commit -m 'Close independent review safety gaps'
          git push origin HEAD:feat/v0.1.2-stable-install-cloudflare
