name: Finalize v0.1.2 review contracts
on:
  push:
    branches: ["feat/v0.1.2-stable-install-cloudflare"]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.1.2-stable-install-cloudflare
          fetch-depth: 0
      - name: Update CI contracts for reviewed Cloudflare hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = '''          grep -qF 'Refusing to modify it automatically' manage.sh
          grep -qF 'if [ "$dns_owned" = "true" ] && [ -n "$dns_id" ]; then' manage.sh
          grep -qF 'if [ "$old_dns_owned" = "true" ] && [ -n "$old_dns" ]; then' manage.sh
          '''
          new = '''          grep -qF 'delete_recorded_cloudflare_resources(){' manage.sh
          grep -qF 'cf_delete_owned(){' manage.sh
          grep -qF 'Refusing to adopt or modify the replacement record.' manage.sh
          grep -qF 'Refusing to modify or adopt it automatically.' manage.sh
          grep -qF 'restore_updated_dns_record(){' manage.sh
          grep -qF 'different Cloudflare zone' manage.sh
          grep -qF 'Recorded ownership state was preserved for a safe retry.' manage.sh
          '''
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('expected CI contract block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          bash -n manage.sh install.sh update.sh uninstall.sh scripts/build-release.sh
          git diff --check
          grep -qF "grep -qF 'delete_recorded_cloudflare_resources(){' manage.sh" .github/workflows/ci.yml
          grep -qF "grep -qF 'restore_updated_dns_record(){' manage.sh" .github/workflows/ci.yml
          grep -qF "grep -qF 'Recorded ownership state was preserved for a safe retry.' manage.sh" .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo 'CI review contracts are already current.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Test Cloudflare ownership rollback contracts'
          git push origin HEAD:feat/v0.1.2-stable-install-cloudflare