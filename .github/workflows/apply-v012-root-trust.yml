name: Apply v0.1.2 root trust-boundary hardening
on:
  push:
    branches: [feat/v0.1.2-stable-install-cloudflare]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Run root trust-boundary hardening'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.1.2-stable-install-cloudflare
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Apply and validate root trust-boundary hardening
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/fix-v012-root-applicator.py
          python3 scripts/fix-v012-root-applicator.py
          python3 -m py_compile scripts/apply-v012-root-trust-boundary.py
          python3 scripts/apply-v012-root-trust-boundary.py
          chmod +x tests/root_trust_boundary.sh tests/cloudflare_transaction.sh tests/cloudflare_crash_recovery.sh
          gofmt -w internal/executor/executor.go internal/executor/executor_test.go
          bash -n install.sh update.sh uninstall.sh manage.sh scripts/build-release.sh tests/cloudflare_transaction.sh tests/cloudflare_crash_recovery.sh tests/root_trust_boundary.sh
          go test -race ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/ai-server-agent ./cmd/ai-server-agent
          sudo env AI_SERVER_AGENT_BINARY=/tmp/ai-server-agent AI_SERVER_AGENT_NONINTERACTIVE=1 bash install.sh
          sudo bash tests/root_trust_boundary.sh
          sudo bash tests/cloudflare_transaction.sh
          sudo bash tests/cloudflare_crash_recovery.sh
          sudo env AI_SERVER_AGENT_YES=1 bash uninstall.sh --purge
          rm -rf dist
          bash scripts/build-release.sh v0.1.2
          (cd dist && sha256sum -c SHA256SUMS)
          git diff --check
      - name: Commit product changes
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install.sh update.sh manage.sh README.md docs/ARCHITECTURE.md internal/executor/executor.go internal/executor/executor_test.go tests/cloudflare_transaction.sh tests/cloudflare_crash_recovery.sh tests/root_trust_boundary.sh .github/workflows/ci.yml .github/workflows/security.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Harden root-trusted state boundary'
          git push origin HEAD:feat/v0.1.2-stable-install-cloudflare
