name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify stable tag and main ancestry
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Download exact main CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&head_sha=$GITHUB_SHA&per_page=20" --jq '.workflow_runs[] | select(.event == "push" and .head_branch == "main") | .id' | head -n1)"
          test -n "$run_id" || { echo "No successful main CI run found for $GITHUB_SHA" >&2; exit 1; }
          actual_sha="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_sha')"
          test "$actual_sha" = "$GITHUB_SHA" || { echo "Selected CI run is for $actual_sha, expected $GITHUB_SHA" >&2; exit 1; }
          artifact="ai-server-agent-$GITHUB_REF_NAME-$GITHUB_SHA"
          mkdir -p dist
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir dist
      - name: Verify promoted release payload
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="dist/ai-server-agent_${version}_linux_amd64.tar.gz"
          test -f "$archive"
          test -f dist/SHA256SUMS
          test -f dist/install.sh
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          test "$(wc -l < dist/SHA256SUMS)" -eq 1
          grep -qF "  ai-server-agent_${version}_linux_amd64.tar.gz" dist/SHA256SUMS
          grep -qF "export AI_SERVER_AGENT_VERSION=$GITHUB_REF_NAME" dist/install.sh
          grep -qF "export AI_SERVER_AGENT_REF=$GITHUB_REF_NAME" dist/install.sh
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish release payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to mutate an existing release." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/ai-server-agent_${version}_linux_amd64.tar.gz" \
            dist/SHA256SUMS \
            dist/install.sh \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --latest \
            --fail-on-no-commits
      - name: Verify immutable release and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          release_json="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          jq -e --arg tag "$GITHUB_REF_NAME" '.tag_name == $tag and .draft == false and .prerelease == false and .immutable == true' >/dev/null <<<"$release_json" || {
            echo "Published release is not immutable. The repository immutable-release setting must be enabled before release publication." >&2
            exit 1
          }
          test "$(git rev-parse "$GITHUB_REF_NAME^{}")" = "$GITHUB_SHA"
          verified=0
          for attempt in 1 2 3 4 5 6; do
            if gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/tmp/release-attestation.json 2>/tmp/release-attestation.err; then
              verified=1
              break
            fi
            sleep 5
          done
          if [ "$verified" -ne 1 ]; then
            cat /tmp/release-attestation.err >&2 || true
            echo "GitHub release attestation verification did not succeed." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          gh release verify-asset "$GITHUB_REF_NAME" "dist/ai-server-agent_${version}_linux_amd64.tar.gz" --repo "$GITHUB_REPOSITORY"
          gh release verify-asset "$GITHUB_REF_NAME" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY"
          gh release verify-asset "$GITHUB_REF_NAME" dist/install.sh --repo "$GITHUB_REPOSITORY"
