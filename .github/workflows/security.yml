name: High Assurance Security
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  cloudflare-transaction:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n manage.sh tests/cloudflare_transaction.sh tests/cloudflare_crash_recovery.sh tests/cloudflare_phase_recovery.sh
      - name: Cloudflare mutation rollback and ownership recovery
        run: sudo bash tests/cloudflare_transaction.sh
      - name: Cloudflare SIGKILL crash recovery
        run: sudo bash tests/cloudflare_crash_recovery.sh
      - name: Cloudflare durable commit and malformed-journal recovery
        run: sudo bash tests/cloudflare_phase_recovery.sh
      - name: Privileged shell startup-file isolation
        run: sudo env PATH="$PATH" go test ./internal/executor -run TestRootCommandAndJobIgnoreWorkerStartupFiles -count=1

  root-trust-boundary:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Shell syntax
        run: bash -n tests/root_trust_boundary.sh tests/root_trust_migration.sh
      - name: Build local test binary
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/ai-server-agent ./cmd/ai-server-agent
      - name: Migrate hostile legacy state and verify root trust boundary
        run: |
          set -Eeuo pipefail
          sudo env AI_SERVER_AGENT_BINARY=/tmp/ai-server-agent bash tests/root_trust_migration.sh
          sudo bash tests/root_trust_boundary.sh
      - name: Cleanup test installation
        if: always()
        run: sudo env AI_SERVER_AGENT_YES=1 bash uninstall.sh --purge || true

  stable-provenance:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build release-scoped installer
        run: |
          set -Eeuo pipefail
          bash scripts/build-release.sh v0.1.2
          test "$(sed -n '1p' dist/install.sh)" = '#!/usr/bin/env bash'
          test "$(sed -n '2p' dist/install.sh)" = 'export AI_SERVER_AGENT_VERSION=v0.1.2'
          test "$(sed -n '3p' dist/install.sh)" = 'export AI_SERVER_AGENT_REF=v0.1.2'
      - name: Reject stable binary override
        run: |
          if sudo env AI_SERVER_AGENT_BINARY=/bin/true bash dist/install.sh --check >/tmp/binary-override.out 2>&1; then
            echo 'stable installer accepted AI_SERVER_AGENT_BINARY' >&2
            cat /tmp/binary-override.out >&2
            exit 1
          fi
          grep -qF 'AI_SERVER_AGENT_BINARY is disabled for stable releases' /tmp/binary-override.out
      - name: Reject corrupted release archive
        run: |
          set -Eeuo pipefail
          fixture="$(mktemp -d)"
          fakebin="$fixture/bin"
          mkdir -p "$fakebin"
          printf 'corrupted release bytes\n' > "$fixture/corrupt.tgz"
          printf 'different expected bytes\n' > "$fixture/expected.tgz"
          expected_sha="$(sha256sum "$fixture/expected.tgz" | awk '{print $1}')"
          printf '%s  ai-server-agent_0.1.2_linux_amd64.tar.gz\n' "$expected_sha" > "$fixture/SHA256SUMS"
          cat > "$fakebin/curl" <<'CURL'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          out=''
          url=''
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -o) out="$2"; shift 2 ;;
              -*) shift ;;
              *) url="$1"; shift ;;
            esac
          done
          [ -n "$out" ] || exit 22
          case "$url" in
            */SHA256SUMS) cp "$FIXTURE_SUMS" "$out" ;;
            *.tar.gz) cp "$FIXTURE_ARCHIVE" "$out" ;;
            *) exit 22 ;;
          esac
          CURL
          chmod +x "$fakebin/curl"
          if sudo env \
            PATH="$fakebin:$PATH" \
            FIXTURE_ARCHIVE="$fixture/corrupt.tgz" \
            FIXTURE_SUMS="$fixture/SHA256SUMS" \
            AI_SERVER_AGENT_NONINTERACTIVE=1 \
            AI_SERVER_AGENT_SETUP_MODE=local \
            bash dist/install.sh >/tmp/corrupt-release.out 2>&1; then
            echo 'corrupted release archive was accepted' >&2
            cat /tmp/corrupt-release.out >&2
            exit 1
          fi
          grep -Eq 'FAILED|checksum|sha256' /tmp/corrupt-release.out
          sudo test ! -e /usr/local/bin/ai-server-agent

  stable-update-trust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Stable plan does not require unpublished release
        run: |
          state="$(mktemp)"
          cat > "$state" <<'STATE'
          {"channel":"stable","version":"v0.1.1","ref":"v0.1.1","track_ref":"v0.1.1"}
          STATE
          fakebin="$(mktemp -d)"
          cat > "$fakebin/curl" <<'CURL'
          #!/usr/bin/env bash
          exit 99
          CURL
          chmod +x "$fakebin/curl"
          sudo env \
            PATH="$fakebin:$PATH" \
            AI_SERVER_AGENT_INSTALL_STATE="$state" \
            AI_SERVER_AGENT_VERSION=v0.1.2 \
            AI_SERVER_AGENT_REF=v0.1.2 \
            bash update.sh --plan >/tmp/stable-plan.out
          grep -qF 'Target version: v0.1.2' /tmp/stable-plan.out
          grep -qF 'Target ref: v0.1.2' /tmp/stable-plan.out
      - name: Reject mutable stable release before installer download
        run: |
          set -Eeuo pipefail
          state="$(mktemp)"
          cat > "$state" <<'STATE'
          {"channel":"stable","version":"v0.1.1","ref":"v0.1.1","track_ref":"v0.1.1"}
          STATE
          fakebin="$(mktemp -d)"
          marker="$(mktemp)"
          rm -f "$marker"
          cat > "$fakebin/curl" <<'CURL'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          url=''
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -H) shift 2 ;;
              -o) printf '%s\n' installer-download > "$INSTALLER_MARKER"; exit 90 ;;
              -*) shift ;;
              *) url="$1"; shift ;;
            esac
          done
          case "$url" in
            */releases/tags/v0.1.2)
              printf '%s\n' '{"tag_name":"v0.1.2","draft":false,"prerelease":false,"immutable":false,"assets":[]}'
              ;;
            */releases/download/*)
              printf '%s\n' installer-download > "$INSTALLER_MARKER"
              exit 90
              ;;
            *) exit 91 ;;
          esac
          CURL
          chmod +x "$fakebin/curl"
          if sudo env \
            PATH="$fakebin:$PATH" \
            INSTALLER_MARKER="$marker" \
            AI_SERVER_AGENT_INSTALL_STATE="$state" \
            AI_SERVER_AGENT_VERSION=v0.1.2 \
            AI_SERVER_AGENT_REF=v0.1.2 \
            bash update.sh >/tmp/mutable-release.out 2>&1; then
            echo 'mutable stable release was accepted' >&2
            exit 1
          fi
          grep -qF 'Stable update requires a published immutable release for v0.1.2' /tmp/mutable-release.out
          test ! -e "$marker"
      - name: Verify immutable release installer asset digest before execution
        run: |
          set -Eeuo pipefail
          state="$(mktemp)"
          cat > "$state" <<'STATE'
          {"channel":"stable","version":"v0.1.1","ref":"v0.1.1","track_ref":"v0.1.1"}
          STATE
          fixture="$(mktemp -d)"
          fakebin="$fixture/bin"
          mkdir -p "$fakebin"
          marker="$fixture/executed"
          cat > "$fixture/install.sh" <<'INSTALLER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          printf 'executed\n' > "$EXEC_MARKER"
          INSTALLER
          digest="sha256:$(sha256sum "$fixture/install.sh" | awk '{print $1}')"
          cat > "$fakebin/curl" <<'CURL'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          out=''
          url=''
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -H) shift 2 ;;
              -o) out="$2"; shift 2 ;;
              -*) shift ;;
              *) url="$1"; shift ;;
            esac
          done
          case "$url" in
            */releases/tags/v0.1.2)
              printf '{"tag_name":"v0.1.2","draft":false,"prerelease":false,"immutable":true,"assets":[{"name":"install.sh","state":"uploaded","digest":"%s","browser_download_url":"https://github.com/ach1992/ai-server-agent/releases/download/v0.1.2/install.sh"}]}\n' "$INSTALLER_DIGEST"
              ;;
            https://github.com/ach1992/ai-server-agent/releases/download/v0.1.2/install.sh)
              [ -n "$out" ] || exit 92
              cp "$FIXTURE_INSTALLER" "$out"
              ;;
            *) exit 91 ;;
          esac
          CURL
          cat > "$fakebin/systemctl" <<'SYSTEMCTL'
          #!/usr/bin/env bash
          exit 0
          SYSTEMCTL
          chmod +x "$fakebin/curl" "$fakebin/systemctl"
          sudo env \
            PATH="$fakebin:$PATH" \
            INSTALLER_DIGEST="$digest" \
            FIXTURE_INSTALLER="$fixture/install.sh" \
            EXEC_MARKER="$marker" \
            AI_SERVER_AGENT_INSTALL_STATE="$state" \
            AI_SERVER_AGENT_VERSION=v0.1.2 \
            AI_SERVER_AGENT_REF=v0.1.2 \
            bash update.sh >/tmp/digest-update.out
          test -s "$marker"
          grep -qF "AI Server Agent update completed on the 'stable' channel." /tmp/digest-update.out
      - name: Reject stable installer asset digest mismatch before execution
        run: |
          set -Eeuo pipefail
          state="$(mktemp)"
          cat > "$state" <<'STATE'
          {"channel":"stable","version":"v0.1.1","ref":"v0.1.1","track_ref":"v0.1.1"}
          STATE
          fixture="$(mktemp -d)"
          fakebin="$fixture/bin"
          mkdir -p "$fakebin"
          marker="$fixture/executed"
          cat > "$fixture/install.sh" <<'INSTALLER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          printf 'executed\n' > "$EXEC_MARKER"
          INSTALLER
          wrong_digest="sha256:$(printf 'different trusted bytes\n' | sha256sum | awk '{print $1}')"
          cat > "$fakebin/curl" <<'CURL'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          out=''
          url=''
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -H) shift 2 ;;
              -o) out="$2"; shift 2 ;;
              -*) shift ;;
              *) url="$1"; shift ;;
            esac
          done
          case "$url" in
            */releases/tags/v0.1.2)
              printf '{"tag_name":"v0.1.2","draft":false,"prerelease":false,"immutable":true,"assets":[{"name":"install.sh","state":"uploaded","digest":"%s","browser_download_url":"https://github.com/ach1992/ai-server-agent/releases/download/v0.1.2/install.sh"}]}\n' "$INSTALLER_DIGEST"
              ;;
            https://github.com/ach1992/ai-server-agent/releases/download/v0.1.2/install.sh)
              [ -n "$out" ] || exit 92
              cp "$FIXTURE_INSTALLER" "$out"
              ;;
            *) exit 91 ;;
          esac
          CURL
          chmod +x "$fakebin/curl"
          if sudo env \
            PATH="$fakebin:$PATH" \
            INSTALLER_DIGEST="$wrong_digest" \
            FIXTURE_INSTALLER="$fixture/install.sh" \
            EXEC_MARKER="$marker" \
            AI_SERVER_AGENT_INSTALL_STATE="$state" \
            AI_SERVER_AGENT_VERSION=v0.1.2 \
            AI_SERVER_AGENT_REF=v0.1.2 \
            bash update.sh >/tmp/digest-mismatch.out 2>&1; then
            echo 'installer with mismatched release-asset digest was executed' >&2
            exit 1
          fi
          grep -qF 'Stable release install.sh digest mismatch' /tmp/digest-mismatch.out
          test ! -e "$marker"
      - name: Release publication uses explicit operator controls and exact-SHA automation
        run: |
          set -Eeuo pipefail
          grep -qF 'workflow_dispatch:' .github/workflows/release.yml
          if grep -qF "tags: ['v*']" .github/workflows/release.yml; then
            echo 'release must not publish automatically from a tag push' >&2
            exit 1
          fi
          grep -qF 'immutability_confirmation:' .github/workflows/release.yml
          grep -qF 'IMMUTABLE_RELEASES_ENABLED' .github/workflows/release.yml
          grep -qF 'tag_protection_confirmation:' .github/workflows/release.yml
          grep -qF 'RELEASE_TAG_PROTECTION_VERIFIED' .github/workflows/release.yml
          grep -qF 'release_sha:' .github/workflows/release.yml
          grep -qF 'group: stable-release' .github/workflows/release.yml
          if grep -qF 'rulesets?targets=tag' .github/workflows/release.yml; then
            echo 'release workflow must not pretend GITHUB_TOKEN can prove complete tag-ruleset bypass state' >&2
            exit 1
          fi
          if grep -qF '(.bypass_actors // [])' .github/workflows/release.yml; then
            echo 'release workflow must not normalize omitted bypass_actors to an empty authoritative set' >&2
            exit 1
          fi
          if grep -qF -- '--target "$RELEASE_SHA"' .github/workflows/release.yml; then
            echo 'release must not rely on --target for an existing tag' >&2
            exit 1
          fi
          grep -qF -- '--verify-tag' .github/workflows/release.yml
          grep -qF 'gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs"' .github/workflows/release.yml
          grep -qF -- '-f sha="$RELEASE_SHA"' .github/workflows/release.yml
          gate_line="$(grep -nF 'Pre-publication operator release-control gate' .github/workflows/release.yml | cut -d: -f1)"
          recheck_line="$(grep -nF 'Recheck operator release-control gate before publication' .github/workflows/release.yml | cut -d: -f1)"
          tag_line="$(grep -nF 'Create and verify exact protected release tag' .github/workflows/release.yml | cut -d: -f1)"
          publish_line="$(grep -nF 'Publish release payload' .github/workflows/release.yml | cut -d: -f1)"
          verify_line="$(grep -nF 'Verify immutable release and attestations' .github/workflows/release.yml | cut -d: -f1)"
          test -n "$gate_line" && test -n "$recheck_line" && test -n "$tag_line" && test -n "$publish_line" && test -n "$verify_line"
          test "$gate_line" -lt "$recheck_line"
          test "$recheck_line" -lt "$tag_line"
          test "$tag_line" -lt "$publish_line"
          test "$publish_line" -lt "$verify_line"
          grep -qF '.immutable == true' .github/workflows/release.yml
          grep -qF 'gh release verify "$RELEASE_TAG"' .github/workflows/release.yml
          grep -qF 'gh release verify-asset' .github/workflows/release.yml
