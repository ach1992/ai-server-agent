name: High Assurance Security
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  cloudflare-transaction:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n manage.sh tests/cloudflare_transaction.sh
      - name: Cloudflare mutation rollback and ownership recovery
        run: sudo bash tests/cloudflare_transaction.sh

  stable-provenance:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build release-scoped installer
        run: bash scripts/build-release.sh v0.1.2
      - name: Reject stable binary override
        run: |
          if sudo env AI_SERVER_AGENT_BINARY=/bin/true bash dist/install.sh --check >/tmp/binary-override.out 2>&1; then
            echo 'stable installer accepted AI_SERVER_AGENT_BINARY' >&2
            cat /tmp/binary-override.out >&2
            exit 1
          fi
          grep -qF 'AI_SERVER_AGENT_BINARY is disabled for stable releases' /tmp/binary-override.out
      - name: Reject corrupted release archive
        run: |
          set -Eeuo pipefail
          fixture="$(mktemp -d)"
          fakebin="$fixture/bin"
          mkdir -p "$fakebin"
          printf 'corrupted release bytes\n' > "$fixture/corrupt.tgz"
          printf 'different expected bytes\n' > "$fixture/expected.tgz"
          expected_sha="$(sha256sum "$fixture/expected.tgz" | awk '{print $1}')"
          printf '%s  ai-server-agent_0.1.2_linux_amd64.tar.gz\n' "$expected_sha" > "$fixture/SHA256SUMS"
          cat > "$fakebin/curl" <<'CURL'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          out=''
          url=''
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -o) out="$2"; shift 2 ;;
              -*) shift ;;
              *) url="$1"; shift ;;
            esac
          done
          [ -n "$out" ] || exit 22
          case "$url" in
            */SHA256SUMS) cp "$FIXTURE_SUMS" "$out" ;;
            *.tar.gz) cp "$FIXTURE_ARCHIVE" "$out" ;;
            *) exit 22 ;;
          esac
          CURL
          chmod +x "$fakebin/curl"
          if sudo env \
            PATH="$fakebin:$PATH" \
            FIXTURE_ARCHIVE="$fixture/corrupt.tgz" \
            FIXTURE_SUMS="$fixture/SHA256SUMS" \
            AI_SERVER_AGENT_NONINTERACTIVE=1 \
            AI_SERVER_AGENT_SETUP_MODE=local \
            bash dist/install.sh >/tmp/corrupt-release.out 2>&1; then
            echo 'corrupted release archive was accepted' >&2
            cat /tmp/corrupt-release.out >&2
            exit 1
          fi
          grep -Eq 'FAILED|checksum|sha256' /tmp/corrupt-release.out
          sudo test ! -e /usr/local/bin/ai-server-agent

  stable-update-trust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Stable plan does not require unpublished release
        run: |
          state="$(mktemp)"
          cat > "$state" <<'STATE'
          CHANNEL=stable
          VERSION=v0.1.1
          REF=v0.1.1
          TRACK_REF=v0.1.1
          STATE
          fakebin="$(mktemp -d)"
          cat > "$fakebin/curl" <<'CURL'
          #!/usr/bin/env bash
          exit 99
          CURL
          chmod +x "$fakebin/curl"
          sudo env \
            PATH="$fakebin:$PATH" \
            AI_SERVER_AGENT_INSTALL_STATE="$state" \
            AI_SERVER_AGENT_VERSION=v0.1.2 \
            AI_SERVER_AGENT_REF=v0.1.2 \
            bash update.sh --plan >/tmp/stable-plan.out
          grep -qF 'Target version: v0.1.2' /tmp/stable-plan.out
          grep -qF 'Target ref: v0.1.2' /tmp/stable-plan.out
      - name: Reject mutable stable release before installer download
        run: |
          set -Eeuo pipefail
          state="$(mktemp)"
          cat > "$state" <<'STATE'
          CHANNEL=stable
          VERSION=v0.1.1
          REF=v0.1.1
          TRACK_REF=v0.1.1
          STATE
          fakebin="$(mktemp -d)"
          marker="$(mktemp)"
          rm -f "$marker"
          cat > "$fakebin/curl" <<'CURL'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          url=''
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -H) shift 2 ;;
              -o) printf '%s\n' installer-download > "$INSTALLER_MARKER"; exit 90 ;;
              -*) shift ;;
              *) url="$1"; shift ;;
            esac
          done
          case "$url" in
            */releases/tags/v0.1.2)
              printf '%s\n' '{"tag_name":"v0.1.2","draft":false,"prerelease":false,"immutable":false}'
              ;;
            */releases/download/*)
              printf '%s\n' installer-download > "$INSTALLER_MARKER"
              exit 90
              ;;
            *) exit 91 ;;
          esac
          CURL
          chmod +x "$fakebin/curl"
          if sudo env \
            PATH="$fakebin:$PATH" \
            INSTALLER_MARKER="$marker" \
            AI_SERVER_AGENT_INSTALL_STATE="$state" \
            AI_SERVER_AGENT_VERSION=v0.1.2 \
            AI_SERVER_AGENT_REF=v0.1.2 \
            bash update.sh >/tmp/mutable-release.out 2>&1; then
            echo 'mutable stable release was accepted' >&2
            exit 1
          fi
          grep -qF 'Stable update requires a published immutable release for v0.1.2' /tmp/mutable-release.out
          test ! -e "$marker"
      - name: Release workflow immutability contract
        run: |
          grep -qF '.immutable == true' .github/workflows/release.yml
          grep -qF 'gh release verify "$GITHUB_REF_NAME"' .github/workflows/release.yml
          grep -qF 'gh release verify-asset' .github/workflows/release.yml
