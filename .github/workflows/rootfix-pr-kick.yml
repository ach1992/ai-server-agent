name: Rootfix PR Kick

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/cloudflare-rulesets-contract-v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-rulesets-contract-v2
          fetch-depth: 0
      - name: Execute staged deterministic patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/rootfix-selfpatch.yml').read_text().splitlines()
          start = src.index('        run: |') + 1
          body = []
          for line in src[start:]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  break
          if not body or body[0] != 'set -Eeuo pipefail':
              raise SystemExit('could not extract staged root-fix script')
          Path('/tmp/rootfix.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/rootfix.sh
          rm -f .github/workflows/rootfix-pr-kick.yml .github/workflows/rootfix-kick.yml
          git add .github/workflows/rootfix-pr-kick.yml .github/workflows/rootfix-kick.yml
          git diff --cached --check
          git commit -m 'chore: remove temporary root-fix runners'
          git push origin HEAD:fix/cloudflare-rulesets-contract-v2
