name: Apply validated Cloudflare rule fix
on:
  push:
    branches: [fix/cloudflare-rule-response-contract]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply validated live fix
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('manage.sh')
          text = path.read_text()

          replacements = [
              (
          '''        CF_RESULT_ORIGIN_RULESET_ID="$ruleset_id"; CF_RESULT_ORIGIN_RULE_ID="$(jq -r '.result.id // empty' <<<"$res")"; CF_RESULT_ORIGIN_ACTION=created
                  rule="$(jq -ce '.result | select(type=="object")' <<<"$res")" || die "Cloudflare returned an invalid recreated Origin Rule."
                  CF_RESULT_ORIGIN_FINGERPRINT="$(cf_rule_fingerprint <<<"$rule")"''',
          '''        [ "$(jq -r '.result.id // empty' <<<"$res")" = "$ruleset_id" ] || die "Cloudflare returned an unexpected Origin Ruleset ID after rule creation."
                  rule="$(jq -ce --arg ref "$rule_ref" --arg marker "$marker" '[.result.rules[]? | select(.ref==$ref and ((.description // "") | endswith(" txn:"+$marker)))] | select(length==1) | .[0]' <<<"$res")" || die "Cloudflare returned an invalid or ambiguous recreated Origin Rule."
                  CF_RESULT_ORIGIN_RULESET_ID="$ruleset_id"; CF_RESULT_ORIGIN_RULE_ID="$(jq -r '.id // empty' <<<"$rule")"; CF_RESULT_ORIGIN_ACTION=created
                  [ -n "$CF_RESULT_ORIGIN_RULE_ID" ] || die "Cloudflare did not return the recreated Origin Rule ID."
                  CF_RESULT_ORIGIN_FINGERPRINT="$(cf_rule_fingerprint <<<"$rule")"
                  log "Cloudflare diagnostic: Origin rule create response matched rule $CF_RESULT_ORIGIN_RULE_ID in ruleset $ruleset_id."'''
              ),
              (
          '''      CF_RESULT_ORIGIN_RULESET_ID="$ruleset_id"; CF_RESULT_ORIGIN_RULE_ID="$(jq -r '.result.id // empty' <<<"$res")"; CF_RESULT_ORIGIN_ACTION=created
                rule="$(jq -ce '.result | select(type=="object")' <<<"$res")" || die "Cloudflare returned an invalid created Origin Rule."
                CF_RESULT_ORIGIN_FINGERPRINT="$(cf_rule_fingerprint <<<"$rule")"''',
          '''      [ "$(jq -r '.result.id // empty' <<<"$res")" = "$ruleset_id" ] || die "Cloudflare returned an unexpected Origin Ruleset ID after rule creation."
                rule="$(jq -ce --arg ref "$rule_ref" --arg marker "$marker" '[.result.rules[]? | select(.ref==$ref and ((.description // "") | endswith(" txn:"+$marker)))] | select(length==1) | .[0]' <<<"$res")" || die "Cloudflare returned an invalid or ambiguous created Origin Rule."
                CF_RESULT_ORIGIN_RULESET_ID="$ruleset_id"; CF_RESULT_ORIGIN_RULE_ID="$(jq -r '.id // empty' <<<"$rule")"; CF_RESULT_ORIGIN_ACTION=created
                [ -n "$CF_RESULT_ORIGIN_RULE_ID" ] || die "Cloudflare did not return the created Origin Rule ID."
                CF_RESULT_ORIGIN_FINGERPRINT="$(cf_rule_fingerprint <<<"$rule")"
                log "Cloudflare diagnostic: Origin rule create response matched rule $CF_RESULT_ORIGIN_RULE_ID in ruleset $ruleset_id."'''
              ),
              (
          '''        CF_RESULT_SSL_RULESET_ID="$ruleset_id"; CF_RESULT_SSL_RULE_ID="$(jq -r '.result.id // empty' <<<"$res")"; CF_RESULT_SSL_ACTION=created
                  rule="$(jq -ce '.result | select(type=="object")' <<<"$res")" || die "Cloudflare returned an invalid recreated Configuration Rule."
                  CF_RESULT_SSL_FINGERPRINT="$(cf_rule_fingerprint <<<"$rule")"''',
          '''        [ "$(jq -r '.result.id // empty' <<<"$res")" = "$ruleset_id" ] || die "Cloudflare returned an unexpected Configuration Ruleset ID after rule creation."
                  rule="$(jq -ce --arg ref "$rule_ref" --arg marker "$marker" '[.result.rules[]? | select(.ref==$ref and .action=="set_config" and .action_parameters.ssl=="strict" and ((.description // "") | endswith(" txn:"+$marker)))] | select(length==1) | .[0]' <<<"$res")" || die "Cloudflare returned an invalid or ambiguous recreated Configuration Rule."
                  CF_RESULT_SSL_RULESET_ID="$ruleset_id"; CF_RESULT_SSL_RULE_ID="$(jq -r '.id // empty' <<<"$rule")"; CF_RESULT_SSL_ACTION=created
                  [ -n "$CF_RESULT_SSL_RULE_ID" ] || die "Cloudflare did not return the recreated Configuration Rule ID."
                  CF_RESULT_SSL_FINGERPRINT="$(cf_rule_fingerprint <<<"$rule")"
                  log "Cloudflare diagnostic: Configuration rule create response matched rule $CF_RESULT_SSL_RULE_ID in ruleset $ruleset_id."'''
              ),
              (
          '''      CF_RESULT_SSL_RULESET_ID="$ruleset_id"; CF_RESULT_SSL_RULE_ID="$(jq -r '.result.id // empty' <<<"$res")"; CF_RESULT_SSL_ACTION=created
                rule="$(jq -ce '.result | select(type=="object")' <<<"$res")" || die "Cloudflare returned an invalid created Configuration Rule."
                CF_RESULT_SSL_FINGERPRINT="$(cf_rule_fingerprint <<<"$rule")"''',
          '''      [ "$(jq -r '.result.id // empty' <<<"$res")" = "$ruleset_id" ] || die "Cloudflare returned an unexpected Configuration Ruleset ID after rule creation."
                rule="$(jq -ce --arg ref "$rule_ref" --arg marker "$marker" '[.result.rules[]? | select(.ref==$ref and .action=="set_config" and .action_parameters.ssl=="strict" and ((.description // "") | endswith(" txn:"+$marker)))] | select(length==1) | .[0]' <<<"$res")" || die "Cloudflare returned an invalid or ambiguous created Configuration Rule."
                CF_RESULT_SSL_RULESET_ID="$ruleset_id"; CF_RESULT_SSL_RULE_ID="$(jq -r '.id // empty' <<<"$rule")"; CF_RESULT_SSL_ACTION=created
                [ -n "$CF_RESULT_SSL_RULE_ID" ] || die "Cloudflare did not return the created Configuration Rule ID."
                CF_RESULT_SSL_FINGERPRINT="$(cf_rule_fingerprint <<<"$rule")"
                log "Cloudflare diagnostic: Configuration rule create response matched rule $CF_RESULT_SSL_RULE_ID in ruleset $ruleset_id."'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'response-contract patch expected one match, found {count}')
              text = text.replace(old, new)

          origin_start = text.index('cf_reconcile_origin_rule(){')
          ssl_start = text.index('cf_reconcile_ssl_config_rule(){')
          save_start = text.index('save_cloudflare_state(){')
          prefix, origin, ssl, suffix = text[:origin_start], text[origin_start:ssl_start], text[ssl_start:save_start], text[save_start:]

          decl = '  local phase_entry rc ruleset_id rule_ref ref_match id_count rule_body create_body res ruleset marker pending_rule_body ruleset_desc verify_id rule current_fingerprint pending_fingerprint'
          decl_new = decl + ' semantic_ids semantic_count'
          if origin.count(decl) != 1 or ssl.count(decl) != 1:
              raise SystemExit('unexpected reconcile declarations')
          origin = origin.replace(decl, decl_new, 1)
          ssl = ssl.replace(decl, decl_new, 1)

          origin_ref = '''    ref_match="$(jq -r --arg ref "$rule_ref" '.result.rules[]? | select(.ref==$ref) | .id' <<<"$ruleset" | head -n1)"'''
          origin_ref_new = '''    ref_match="$(jq -r --arg ref "$rule_ref" '.result.rules[]? | select(.ref==$ref) | .id' <<<"$ruleset" | head -n1)"
              semantic_ids="$(jq -r --arg host "$host" --argjson port "$port" '
                .result.rules[]?
                | ((.expression // "") | gsub("\\s+";"")) as $expr
                | select(
                    .enabled == true and
                    .action == "route" and
                    (.action_parameters.origin.port // null) == $port and
                    ($expr == ("http.hosteq\\\"" + $host + "\\\"") or $expr == ("(http.hosteq\\\"" + $host + "\\\")"))
                  )
                | .id // empty
              ' <<<"$ruleset")"
              semantic_count="$(grep -cve '^$' <<<"$semantic_ids" || true)"'''
          if origin.count(origin_ref) != 1:
              raise SystemExit('Origin ref discovery changed')
          origin = origin.replace(origin_ref, origin_ref_new, 1)

          origin_owned = '''        jq -e --argjson expected "$rule_body" '.ref==$expected.ref and .expression==$expected.expression and .action==$expected.action and .action_parameters==$expected.action_parameters and .enabled==$expected.enabled' >/dev/null <<<"$rule" || die "The Agent-owned Origin Rule no longer matches the requested canonical state. Refusing an unconditional in-place update; clean up or reconcile it explicitly, then rerun setup."
                  CF_RESULT_ORIGIN_RULESET_ID="$ruleset_id"; CF_RESULT_ORIGIN_RULE_ID="$owned_rule"; CF_RESULT_ORIGIN_FINGERPRINT="$current_fingerprint"'''
          origin_owned_new = '''        jq -e --argjson expected "$rule_body" '.ref==$expected.ref and .expression==$expected.expression and .action==$expected.action and .action_parameters==$expected.action_parameters and .enabled==$expected.enabled' >/dev/null <<<"$rule" || die "The Agent-owned Origin Rule no longer matches the requested canonical state. Refusing an unconditional in-place update; clean up or reconcile it explicitly, then rerun setup."
                  if [ "$semantic_count" -gt 1 ]; then
                    warn "Cloudflare diagnostic: found $semantic_count equivalent Origin Rules in ruleset $ruleset_id for $host:$port; continuing with recorded Agent-owned rule $owned_rule and preserving external equivalents."
                  fi
                  CF_RESULT_ORIGIN_RULESET_ID="$ruleset_id"; CF_RESULT_ORIGIN_RULE_ID="$owned_rule"; CF_RESULT_ORIGIN_FINGERPRINT="$current_fingerprint"'''
          if origin.count(origin_owned) != 1:
              raise SystemExit('Origin owned branch changed')
          origin = origin.replace(origin_owned, origin_owned_new, 1)

          origin_unowned = '''      [ -z "$ref_match" ] || die "An unowned Origin Rule already uses the Agent ref. Refusing to adopt or overwrite it."
                marker="$(cf_new_ownership_marker)"'''
          origin_unowned_new = '''      [ -z "$ref_match" ] || die "An unowned Origin Rule already uses the Agent ref. Refusing to adopt or overwrite it."
                [ "$semantic_count" -eq 0 ] || die "Cloudflare already has $semantic_count equivalent external Origin Rule(s) in ruleset $ruleset_id for $host:$port. Refusing to create a duplicate or adopt external rules automatically."
                marker="$(cf_new_ownership_marker)"'''
          if origin.count(origin_unowned) != 1:
              raise SystemExit('Origin unowned branch changed')
          origin = origin.replace(origin_unowned, origin_unowned_new, 1)

          ssl_ref = '''    ref_match="$(jq -r --arg ref "$rule_ref" '.result.rules[]? | select(.ref==$ref) | .id' <<<"$ruleset" | head -n1)"'''
          ssl_ref_new = '''    ref_match="$(jq -r --arg ref "$rule_ref" '.result.rules[]? | select(.ref==$ref) | .id' <<<"$ruleset" | head -n1)"
              semantic_ids="$(jq -r --arg host "$host" '
                .result.rules[]?
                | ((.expression // "") | gsub("\\s+";"")) as $expr
                | select(
                    .enabled == true and
                    .action == "set_config" and
                    (.action_parameters.ssl // "") == "strict" and
                    ($expr == ("http.hosteq\\\"" + $host + "\\\"") or $expr == ("(http.hosteq\\\"" + $host + "\\\")"))
                  )
                | .id // empty
              ' <<<"$ruleset")"
              semantic_count="$(grep -cve '^$' <<<"$semantic_ids" || true)"'''
          if ssl.count(ssl_ref) != 1:
              raise SystemExit('Configuration ref discovery changed')
          ssl = ssl.replace(ssl_ref, ssl_ref_new, 1)

          ssl_owned = '''        jq -e --argjson expected "$rule_body" '.ref==$expected.ref and .expression==$expected.expression and .action==$expected.action and .action_parameters==$expected.action_parameters and .enabled==$expected.enabled' >/dev/null <<<"$rule" || die "The Agent-owned Configuration Rule no longer matches strict hostname-scoped canonical state. Refusing an unconditional in-place update; clean up or reconcile it explicitly, then rerun setup."
                  CF_RESULT_SSL_RULESET_ID="$ruleset_id"; CF_RESULT_SSL_RULE_ID="$owned_rule"; CF_RESULT_SSL_FINGERPRINT="$current_fingerprint"'''
          ssl_owned_new = '''        jq -e --argjson expected "$rule_body" '.ref==$expected.ref and .expression==$expected.expression and .action==$expected.action and .action_parameters==$expected.action_parameters and .enabled==$expected.enabled' >/dev/null <<<"$rule" || die "The Agent-owned Configuration Rule no longer matches strict hostname-scoped canonical state. Refusing an unconditional in-place update; clean up or reconcile it explicitly, then rerun setup."
                  if [ "$semantic_count" -gt 1 ]; then
                    warn "Cloudflare diagnostic: found $semantic_count equivalent strict SSL Configuration Rules in ruleset $ruleset_id for $host; continuing with recorded Agent-owned rule $owned_rule and preserving external equivalents."
                  fi
                  CF_RESULT_SSL_RULESET_ID="$ruleset_id"; CF_RESULT_SSL_RULE_ID="$owned_rule"; CF_RESULT_SSL_FINGERPRINT="$current_fingerprint"'''
          if ssl.count(ssl_owned) != 1:
              raise SystemExit('Configuration owned branch changed')
          ssl = ssl.replace(ssl_owned, ssl_owned_new, 1)

          ssl_unowned = '''      [ -z "$ref_match" ] || die "An unowned Configuration Rule already uses the Agent SSL ref. Refusing to adopt or overwrite it."
                marker="$(cf_new_ownership_marker)"'''
          ssl_unowned_new = '''      [ -z "$ref_match" ] || die "An unowned Configuration Rule already uses the Agent SSL ref. Refusing to adopt or overwrite it."
                [ "$semantic_count" -eq 0 ] || die "Cloudflare already has $semantic_count equivalent external strict SSL Configuration Rule(s) in ruleset $ruleset_id for $host. Refusing to create a duplicate or adopt external rules automatically."
                marker="$(cf_new_ownership_marker)"'''
          if ssl.count(ssl_unowned) != 1:
              raise SystemExit('Configuration unowned branch changed')
          ssl = ssl.replace(ssl_unowned, ssl_unowned_new, 1)

          path.write_text(prefix + origin + ssl + suffix)
          PY

          python3 <<'PY'
          from pathlib import Path
          path = Path('tests/cloudflare_transaction.sh')
          text = path.read_text()
          marker = "echo 'cloudflare transaction tests passed'"
          if text.count(marker) != 1:
              raise SystemExit('transaction test completion marker changed')
          test = r'''

          # Existing-ruleset rule creation returns the updated Ruleset, not a Rule.
          # Equivalent external rules must never be duplicated or silently adopted,
          # while a recorded Agent-owned rule remains the authoritative rerun target.
          (
            eval "$ORIG_CF_RECONCILE_ORIGIN_RULE"
            eval "$ORIG_CF_RECONCILE_SSL_CONFIG_RULE"
            MUTATION_LOG="$TMP/rule-response-contract-mutations.log"
            origin_ref="ai_server_agent_$(printf '%s' mcp.example.com | sha256sum | cut -c1-16)"
            ssl_ref="ai_server_agent_ssl_$(printf '%s' mcp.example.com | sha256sum | cut -c1-16)"
            manual_origin="$(jq -nc '{id:"manual-origin",ref:"manual-origin",description:"manual origin",expression:"(http.host eq \\\"mcp.example.com\\\")",action:"route",action_parameters:{origin:{port:3210}},enabled:true}')"
            owned_origin="$(jq -nc --arg ref "$origin_ref" '{id:"owned-origin",ref:$ref,description:"AI Server Agent origin port txn:11111111111111111111111111111111",expression:"http.host eq \\\"mcp.example.com\\\"",action:"route",action_parameters:{origin:{port:3210}},enabled:true}')"
            manual_ssl="$(jq -nc '{id:"manual-ssl",ref:"manual-ssl",description:"manual ssl",expression:"(http.host eq \\\"mcp.example.com\\\")",action:"set_config",action_parameters:{ssl:"strict"},enabled:true}')"
            owned_ssl="$(jq -nc --arg ref "$ssl_ref" '{id:"owned-ssl",ref:$ref,description:"AI Server Agent strict SSL txn:22222222222222222222222222222222",expression:"http.host eq \\\"mcp.example.com\\\"",action:"set_config",action_parameters:{ssl:"strict"},enabled:true}')"
            cf_get_phase_entrypoint(){
              local phase="$2"
              case "$phase:$TEST_MODE" in
                http_request_origin:external) jq -nc --argjson rule "$manual_origin" '{id:"origin-set",kind:"zone",phase:"http_request_origin",rules:[$rule]}' ;;
                http_request_origin:owned) jq -nc --argjson manual "$manual_origin" --argjson owned "$owned_origin" '{id:"origin-set",kind:"zone",phase:"http_request_origin",rules:[$manual,$owned]}' ;;
                http_config_settings:external) jq -nc --argjson rule "$manual_ssl" '{id:"ssl-set",kind:"zone",phase:"http_config_settings",rules:[$rule]}' ;;
                http_config_settings:owned) jq -nc --argjson manual "$manual_ssl" --argjson owned "$owned_ssl" '{id:"ssl-set",kind:"zone",phase:"http_config_settings",rules:[$manual,$owned]}' ;;
                *) return 2 ;;
              esac
            }
            cf_set_pending_write(){ printf 'PENDING_WRITE %s\n' "$*" >> "$MUTATION_LOG"; return 99; }
            cf_api(){
              local method="$1" path="$2"
              if [ "$TEST_MODE" = owned ] && [ "$method" = GET ]; then
                case "$path" in
                  /zones/zone1/rulesets/origin-set) jq -nc --argjson manual "$manual_origin" --argjson owned "$owned_origin" '{success:true,result:{rules:[$manual,$owned]}}'; return 0 ;;
                  /zones/zone1/rulesets/ssl-set) jq -nc --argjson manual "$manual_ssl" --argjson owned "$owned_ssl" '{success:true,result:{rules:[$manual,$owned]}}'; return 0 ;;
                esac
              fi
              printf '%s %s mode=%s\n' "$method" "$path" "$TEST_MODE" >> "$MUTATION_LOG"
              return 99
            }

            TEST_MODE=external; : > "$MUTATION_LOG"
            set +e; out="$(cf_reconcile_origin_rule zone1 mcp.example.com 3210 '' '' '' 2>&1)"; rc=$?; set -e
            [ "$rc" -ne 0 ]; grep -Fq 'equivalent external Origin Rule(s)' <<<"$out"; test ! -s "$MUTATION_LOG"

            TEST_MODE=external; : > "$MUTATION_LOG"
            set +e; out="$(cf_reconcile_ssl_config_rule zone1 mcp.example.com '' '' '' 2>&1)"; rc=$?; set -e
            [ "$rc" -ne 0 ]; grep -Fq 'equivalent external strict SSL Configuration Rule(s)' <<<"$out"; test ! -s "$MUTATION_LOG"

            TEST_MODE=owned; : > "$MUTATION_LOG"; origin_fp="$(cf_rule_fingerprint <<<"$owned_origin")"
            out="$(cf_reconcile_origin_rule zone1 mcp.example.com 3210 origin-set owned-origin "$origin_fp" 2>&1)"
            grep -Fq 'found 2 equivalent Origin Rules' <<<"$out"; test ! -s "$MUTATION_LOG"

            TEST_MODE=owned; : > "$MUTATION_LOG"; ssl_fp="$(cf_rule_fingerprint <<<"$owned_ssl")"
            out="$(cf_reconcile_ssl_config_rule zone1 mcp.example.com ssl-set owned-ssl "$ssl_fp" 2>&1)"
            grep -Fq 'found 2 equivalent strict SSL Configuration Rules' <<<"$out"; test ! -s "$MUTATION_LOG"
          )
          '''
          path.write_text(text.replace(marker, test + '\n' + marker))
          PY

          bash -n manage.sh tests/cloudflare_transaction.sh
          sudo bash tests/cloudflare_transaction.sh
          bash tests/cloudflare_rulesets_pagination.sh

      - name: Commit validated fix and remove bootstrap workflow
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-cloudflare-rule-fix.yml
          git add manage.sh tests/cloudflare_transaction.sh
          git diff --cached --check
          git commit -m 'fix: reconcile Cloudflare rule responses safely'
          git push origin HEAD:fix/cloudflare-rule-response-contract
