name: Apply Cloudflare self-review hardening
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/cloudflare-rule-response-contract'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply self-review fixes
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('manage.sh')
          s = p.read_text()
          if 'The recorded Agent-owned Origin Rule is absent, but Cloudflare already has' not in s:
              lines = s.splitlines()
              checks = {
                  'Cloudflare returned an invalid created Origin Rule.': 'Cloudflare returned an Origin Rule that does not match the requested transaction intent.',
                  'Cloudflare returned an invalid or ambiguous recreated Origin Rule.': 'Cloudflare returned a recreated Origin Rule that does not match the requested transaction intent.',
                  'Cloudflare returned an invalid or ambiguous created Origin Rule.': 'Cloudflare returned an Origin Rule that does not match the requested transaction intent.',
                  'Cloudflare returned an invalid created Configuration Rule.': 'Cloudflare returned a Configuration Rule that does not match the requested transaction intent.',
                  'Cloudflare returned an invalid or ambiguous recreated Configuration Rule.': 'Cloudflare returned a recreated Configuration Rule that does not match the requested transaction intent.',
                  'Cloudflare returned an invalid or ambiguous created Configuration Rule.': 'Cloudflare returned a Configuration Rule that does not match the requested transaction intent.',
              }
              seen = {k: 0 for k in checks}
              out = []
              for line in lines:
                  out.append(line)
                  for needle, message in checks.items():
                      if needle in line:
                          seen[needle] += 1
                          indent = line[:len(line) - len(line.lstrip())]
                          out.append(f'{indent}[ "$(cf_rule_intent_fingerprint <<<"$rule")" = "$pending_fingerprint" ] || die "{message}"')
              if any(v != 1 for v in seen.values()):
                  raise SystemExit(f'unexpected create-response structure: {seen}')
              s = '\n'.join(out) + '\n'

              origin_old = '''      elif [ -n "$ref_match" ]; then
                die "An Origin Rule uses the Agent ref but is not the rule recorded as Agent-owned. Refusing to adopt or overwrite it."
              else
                marker="$(cf_new_ownership_marker)"'''
              origin_new = '''      elif [ -n "$ref_match" ]; then
                die "An Origin Rule uses the Agent ref but is not the rule recorded as Agent-owned. Refusing to adopt or overwrite it."
              else
                [ "$semantic_count" -eq 0 ] || die "The recorded Agent-owned Origin Rule is absent, but Cloudflare already has $semantic_count equivalent external Origin Rule(s) in ruleset $ruleset_id for $host:$port. Refusing to recreate a duplicate or adopt external rules automatically."
                marker="$(cf_new_ownership_marker)"'''
              ssl_old = '''      elif [ -n "$ref_match" ]; then
                die "A Configuration Rule uses the Agent SSL ref but is not the rule recorded as Agent-owned. Refusing to adopt or overwrite it."
              else
                marker="$(cf_new_ownership_marker)"'''
              ssl_new = '''      elif [ -n "$ref_match" ]; then
                die "A Configuration Rule uses the Agent SSL ref but is not the rule recorded as Agent-owned. Refusing to adopt or overwrite it."
              else
                [ "$semantic_count" -eq 0 ] || die "The recorded Agent-owned Configuration Rule is absent, but Cloudflare already has $semantic_count equivalent external strict SSL Configuration Rule(s) in ruleset $ruleset_id for $host. Refusing to recreate a duplicate or adopt external rules automatically."
                marker="$(cf_new_ownership_marker)"'''
              if s.count(origin_old) != 1 or s.count(ssl_old) != 1:
                  raise SystemExit('stale-owned branch structure changed')
              s = s.replace(origin_old, origin_new, 1).replace(ssl_old, ssl_new, 1)
              p.write_text(s)

          tp = Path('tests/cloudflare_rulesets_pagination.sh')
          t = tp.read_text()
          marker = '# Stale recorded ownership plus an external equivalent must fail before'
          if marker not in t:
              end = "printf 'Cloudflare Rulesets phase-entrypoint discovery contract passed.\\n'\n"
              if t.count(end) != 1: raise SystemExit('test completion marker drift')
              extra = r'''

          # Stale recorded ownership plus an external equivalent must fail before
          # any create/journal mutation instead of recreating a duplicate.
          TEST_MODE=external; : > "$MUTATION_LOG"; CF_PENDING_MARKER=""
          set +e; out="$(cf_reconcile_origin_rule zone1 mcp.example.com 3210 origin-set missing-origin '' 2>&1)"; rc=$?; set -e
          [ "$rc" -ne 0 ] && grep -Fq 'recorded Agent-owned Origin Rule is absent' <<<"$out" && test ! -s "$MUTATION_LOG" || fail 'stale Origin ownership recreated around an external equivalent'
          TEST_MODE=external; : > "$MUTATION_LOG"; CF_PENDING_MARKER=""
          set +e; out="$(cf_reconcile_ssl_config_rule zone1 mcp.example.com ssl-set missing-ssl '' 2>&1)"; rc=$?; set -e
          [ "$rc" -ne 0 ] && grep -Fq 'recorded Agent-owned Configuration Rule is absent' <<<"$out" && test ! -s "$MUTATION_LOG" || fail 'stale Configuration ownership recreated around an external equivalent'

          # A create response with the right marker/ref but mutated semantics is
          # not confirmation of the durable pre-POST intent.
          cf_get_phase_entrypoint(){ case "$2" in http_request_origin) jq -nc '{id:"origin-set",kind:"zone",phase:"http_request_origin",rules:[]}' ;; *) return 2 ;; esac; }
          cf_set_pending_write(){ CF_PENDING_MARKER="$6"; }
          cf_new_ownership_marker(){ printf '%s\n' 44444444444444444444444444444444; }
          cf_api(){
            local method="$1" path="$2" body="${3:-}" rule
            case "$method:$path" in
              POST:/zones/zone1/rulesets/origin-set/rules)
                rule="$(jq -nc --argjson body "$body" '$body + {id:"drifted-origin"} | .action_parameters.origin.port=9999')"
                jq -nc --argjson rule "$rule" '{success:true,result:{id:"origin-set",rules:[$rule]}}'
                ;;
              *) fail "unexpected intent-drift API call: $method $path" ;;
            esac
          }
          CF_PENDING_MARKER=""
          set +e; out="$(cf_reconcile_origin_rule zone1 mcp.example.com 3210 '' '' '' 2>&1)"; rc=$?; set -e
          [ "$rc" -ne 0 ] && grep -Fq 'does not match the requested transaction intent' <<<"$out" || fail 'semantic drift in a create response was accepted as confirmation'
          '''
              tp.write_text(t.replace(end, extra + '\n' + end))
          PY
          bash -n manage.sh tests/cloudflare_rulesets_pagination.sh
          bash tests/cloudflare_rulesets_pagination.sh
          git diff --check
      - name: Commit code and tests
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manage.sh tests/cloudflare_rulesets_pagination.sh
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: harden Cloudflare rule reconciliation'
          git push origin HEAD:${{ github.head_ref }}
