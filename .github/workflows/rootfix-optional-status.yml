name: Rootfix Optional Read Status

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/cloudflare-rulesets-contract-v2'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-rulesets-contract-v2
          fetch-depth: 0
      - name: Apply optional-read status fix and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/rootfix-optional-status.py
          bash -n manage.sh tests/cloudflare_transaction.sh tests/cloudflare_rulesets_discovery.sh
          sudo bash tests/cloudflare_transaction.sh
          bash tests/cloudflare_rulesets_discovery.sh
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manage.sh tests/cloudflare_rulesets_discovery.sh
          git commit -m 'fix: preserve Cloudflare optional-read absence status'
          git push origin HEAD:fix/cloudflare-rulesets-contract-v2
