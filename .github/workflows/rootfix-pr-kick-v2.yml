name: Rootfix PR Kick v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/cloudflare-rulesets-contract-v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-rulesets-contract-v2
          fetch-depth: 0
      - name: Apply code and regression only
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/rootfix-selfpatch.yml').read_text().splitlines()
          start = src.index('        run: |') + 1
          body = []
          for line in src[start:]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  break
          text = '\n'.join(body) + '\n'
          for line in [
              "ci = Path('.github/workflows/ci.yml')\n",
              "ci_text = ci.read_text()\n",
              "assert ci_text.count('RELEASE_VERSION: v0.1.3') == 1, 'unexpected CI release version shape'\n",
              "ci.write_text(ci_text.replace('RELEASE_VERSION: v0.1.3', 'RELEASE_VERSION: v0.1.4'))\n",
          ]:
              text = text.replace(line, '')
          text = text.replace("rm -f .github/workflows/rootfix-selfpatch.yml\n", '')
          text = text.replace(
              "git add manage.sh tests/cloudflare_rulesets_pagination.sh .github/workflows/ci.yml .github/workflows/rootfix-selfpatch.yml\n",
              "git add manage.sh tests/cloudflare_rulesets_pagination.sh\n",
          )
          if '.github/workflows/ci.yml' in text or 'rootfix-selfpatch.yml' in text[text.find("git add"):]:
              raise SystemExit('workflow mutation remained in filtered patch script')
          Path('/tmp/rootfix-code.sh').write_text(text)
          PY
          bash /tmp/rootfix-code.sh
