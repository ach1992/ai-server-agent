name: Rootfix Completeness Hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/cloudflare-rulesets-contract-v2'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-rulesets-contract-v2
          fetch-depth: 0
      - name: Harden optional-pagination completeness semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          manage = Path('manage.sh')
          text = manage.read_text()
          old_curl = '''      page_out="$(curl -sS --fail-with-body "${retry_args[@]}" --request GET --config "$cfg" -H 'Content-Type: application/json' "$CF_API$page_path")" || { rm -f "$cfg"; return 1; }\n'''
          new_curl = '''      if ! page_out="$(curl -sS --fail-with-body "${retry_args[@]}" --request GET --config "$cfg" -H 'Content-Type: application/json' "$CF_API$page_path")"; then\n        jq -r '.errors[]? | if .code != null then "Cloudflare API error \\(.code): \\(.message)" else .message end' <<<"$page_out" >&2 || true\n        rm -f "$cfg"\n        return 1\n      fi\n'''
          if text.count(old_curl) != 1:
              raise SystemExit(f'unexpected Rulesets curl shape: {text.count(old_curl)}')
          text = text.replace(old_curl, new_curl)

          old_end = '''      next_cursor="$(jq -r '.result_info.cursors.after // empty' <<<"$page_out")"\n      [ -n "$next_cursor" ] || break\n'''
          new_end = '''      next_cursor="$(jq -r '.result_info.cursors.after // empty' <<<"$page_out")"\n      if [ -z "$next_cursor" ] && [ "$(jq '.result | length' <<<"$page_out")" -eq 50 ]; then\n        printf 'Cloudflare Rulesets returned a full 50-item page without a continuation cursor; refusing to infer complete discovery.\\n' >&2\n        rm -f "$cfg"\n        return 1\n      fi\n      [ -n "$next_cursor" ] || break\n'''
          if text.count(old_end) != 1:
              raise SystemExit(f'unexpected Rulesets termination shape: {text.count(old_end)}')
          text = text.replace(old_end, new_end)
          manage.write_text(text)

          test = Path('tests/cloudflare_rulesets_pagination.sh')
          t = test.read_text()
          anchor = '''[ "$(jq -r '.result[0].id' <<<"$out")" = doc-shaped ] || fail 'documented response without result_info was not preserved'\n\n'''
          addition = '''[ "$(jq -r '.result[0].id' <<<"$out")" = doc-shaped ] || fail 'documented response without result_info was not preserved'\n\n# If optional pagination metadata is absent on a full page, completeness cannot\n# be proven. Fail closed instead of treating the first 50 items as exhaustive.\ncurl(){ jq -nc '{success:true,result:[range(0;50) | {id:("r"+tostring),kind:"zone",phase:"http_request_transform"}]}' ; }\nif cf_api GET '/zones/zone1/rulesets' >/dev/null 2>&1; then\n  fail 'full Rulesets page without continuation metadata was accepted as complete'\nfi\n\n# HTTP failures should surface Cloudflare's structured error without exposing the token.\ncurl(){ printf '%s' '{"success":false,"errors":[{"code":10000,"message":"rulesets diagnostic"}]}' ; return 22; }\nset +e\nerr="$(cf_api GET '/zones/zone1/rulesets' 2>&1 >/dev/null)"\nrc=$?\nset -e\n[ "$rc" -ne 0 ] || fail 'Cloudflare HTTP failure was accepted'\ngrep -Fq 'Cloudflare API error 10000: rulesets diagnostic' <<<"$err" || fail 'Cloudflare Rulesets HTTP error body was hidden'\n\n'''
          if t.count(anchor) != 1:
              raise SystemExit(f'unexpected documented-response test anchor: {t.count(anchor)}')
          t = t.replace(anchor, addition)
          test.write_text(t)
          PY
          bash -n manage.sh tests/cloudflare_transaction.sh tests/cloudflare_rulesets_pagination.sh
          sudo bash tests/cloudflare_transaction.sh
          bash tests/cloudflare_rulesets_pagination.sh
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manage.sh tests/cloudflare_rulesets_pagination.sh
          git commit -m 'fix: fail closed on ambiguous full Rulesets page'
          git push origin HEAD:fix/cloudflare-rulesets-contract-v2
