name: Rootfix Fixture Sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/cloudflare-rulesets-contract-v2'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-rulesets-contract-v2
          fetch-depth: 0
      - name: Update stale Rulesets fixtures and validate transaction suite
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('tests/cloudflare_transaction.sh')
          text = p.read_text()
          old = "'/zones/zone1/rulesets?per_page=100')"
          new = "'/zones/zone1/rulesets')"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 stale Rulesets fixtures, found {count}')
          text = text.replace(old, new)
          if 'rulesets?per_page=100' in text:
              raise SystemExit('stale Rulesets sentinel remains in transaction test')
          p.write_text(text)
          PY
          bash -n manage.sh tests/cloudflare_transaction.sh tests/cloudflare_rulesets_pagination.sh
          sudo bash tests/cloudflare_transaction.sh
          bash tests/cloudflare_rulesets_pagination.sh
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/cloudflare_transaction.sh
          git commit -m 'test: align Cloudflare transaction fixtures'
          git push origin HEAD:fix/cloudflare-rulesets-contract-v2
