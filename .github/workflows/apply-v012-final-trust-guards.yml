name: Apply v0.1.2 final trust guards
on:
  push:
    branches: [feat/v0.1.2-stable-install-cloudflare]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Run final trust fail-closed guards'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.1.2-stable-install-cloudflare
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Apply and validate final trust guards
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/apply-v012-final-trust-guards.py
          python3 scripts/apply-v012-final-trust-guards.py
          bash -n install.sh update.sh manage.sh tests/root_trust_boundary.sh tests/root_trust_migration.sh
          go test -race ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/ai-server-agent ./cmd/ai-server-agent
          sudo env AI_SERVER_AGENT_BINARY=/tmp/ai-server-agent bash tests/root_trust_migration.sh
          sudo bash tests/root_trust_boundary.sh
          sudo bash tests/cloudflare_transaction.sh
          sudo bash tests/cloudflare_crash_recovery.sh
          sudo env AI_SERVER_AGENT_YES=1 bash uninstall.sh --purge
          rm -rf dist
          bash scripts/build-release.sh v0.1.2
          (cd dist && sha256sum -c SHA256SUMS)
          git diff --check
      - name: Commit product changes
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install.sh update.sh tests/root_trust_boundary.sh
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Fail closed on missing or inconsistent install trust state'
          git push origin HEAD:feat/v0.1.2-stable-install-cloudflare
