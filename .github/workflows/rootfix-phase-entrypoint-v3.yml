name: Rootfix Phase Entrypoint v3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/cloudflare-rulesets-contract-v2'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-rulesets-contract-v2
          fetch-depth: 0
      - name: Run phase-entrypoint root fix with preserved 404 status
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/rootfix-phase-entrypoint-v2.yml').read_text().splitlines()
          start = src.index('        run: |') + 1
          body = []
          for line in src[start:]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  break
          script = '\n'.join(body) + '\n'
          old = '''    if res="$(cf_get_optional "/zones/$zone_id/rulesets/phases/$phase/entrypoint")"; then
      result="$(jq -ce --arg phase "$phase" '.result | select(type=="object" and (.id|type)=="string" and (.id|length)>0 and .kind=="zone" and .phase==$phase and (.rules|type)=="array")' <<<"$res")" || return 2
      printf '%s\\n' "$result"
      return 0
    fi
    rc=$?
    [ "$rc" -eq 3 ] && return 3
    return 2
'''
          new = '''    if res="$(cf_get_optional "/zones/$zone_id/rulesets/phases/$phase/entrypoint")"; then
      result="$(jq -ce --arg phase "$phase" '.result | select(type=="object" and (.id|type)=="string" and (.id|length)>0 and .kind=="zone" and .phase==$phase and (.rules|type)=="array")' <<<"$res")" || return 2
      printf '%s\\n' "$result"
      return 0
    else
      rc=$?
      [ "$rc" -eq 3 ] && return 3
      return 2
    fi
'''
          if script.count(old) != 1:
              raise SystemExit(f'unexpected phase helper status shape: {script.count(old)}')
          Path('/tmp/rootfix-phase.sh').write_text(script.replace(old, new))
          PY
          bash /tmp/rootfix-phase.sh
