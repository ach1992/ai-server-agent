name: Fix repair source occurrence
on:
  push:
    branches: [feat/v0.1.2-stable-install-cloudflare]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Fix repair source occurrence'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.1.2-stable-install-cloudflare
      - name: Make duplicated recovery-stub replacement explicit
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/.tmp-irfix-part04')
          s = p.read_text()
          old = "'''cf_delete_dns_if_expected(){ printf '/zones/%s/dns_records/%s\\\\n' \"$1\" \"$2\" >> \"$DELETE_LOG\"; return 0; }\\nrecover_cloudflare_transaction''', count=1)\n# State-write rollback test"
          new = "'''cf_delete_dns_if_expected(){ printf '/zones/%s/dns_records/%s\\\\n' \"$1\" \"$2\" >> \"$DELETE_LOG\"; return 0; }\\nrecover_cloudflare_transaction''', count=2)\n# State-write rollback test"
          if old not in s:
              raise SystemExit('expected duplicated recovery-stub replacement source not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/.tmp-irfix-part04
          git commit -m 'Repair independent review remediation'
          git push origin HEAD:feat/v0.1.2-stable-install-cloudflare
