name: Rootfix Phase Entrypoint v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/cloudflare-rulesets-contract-v2'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-rulesets-contract-v2
          fetch-depth: 0
      - name: Replace zone-wide Rulesets listing with exact phase entrypoints
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          manage = Path('manage.sh')
          text = manage.read_text()

          start = text.index('cf_list_zone_rulesets(){\n')
          end = text.index('\n\ncf_delete_owned(){', start)
          text = text[:start] + text[end:]

          old_optional = '''  [ "$status" = "404" ] && return 3\n  [[ "$status" =~ ^2[0-9][0-9]$ ]] || return 2\n  jq -e '.success == true' >/dev/null 2>&1 <<<"$body" || return 2\n  printf '%s' "$body"\n}\n'''
          new_optional = '''  [ "$status" = "404" ] && return 3\n  [[ "$status" =~ ^2[0-9][0-9]$ ]] || { cf_report_api_errors "$body"; return 2; }\n  jq -e '.success == true' >/dev/null 2>&1 <<<"$body" || { cf_report_api_errors "$body"; return 2; }\n  printf '%s' "$body"\n}\n'''
          if text.count(old_optional) != 1:
              raise SystemExit(f'unexpected cf_get_optional shape: {text.count(old_optional)}')
          text = text.replace(old_optional, new_optional)

          marker = '\n\ncf_dns_fingerprint(){'
          helper = textwrap.dedent(r'''

          cf_get_phase_entrypoint(){
            local zone_id="$1" phase="$2" res rc result
            [ -n "$zone_id" ] || return 2
            case "$phase" in
              http_request_origin|http_config_settings) ;;
              *) return 2 ;;
            esac
            if res="$(cf_get_optional "/zones/$zone_id/rulesets/phases/$phase/entrypoint")"; then
              result="$(jq -ce --arg phase "$phase" '.result | select(type=="object" and (.id|type)=="string" and (.id|length)>0 and .kind=="zone" and .phase==$phase and (.rules|type)=="array")' <<<"$res")" || return 2
              printf '%s\n' "$result"
              return 0
            fi
            rc=$?
            [ "$rc" -eq 3 ] && return 3
            return 2
          }
          ''').rstrip()
          if text.count(marker) != 1:
              raise SystemExit('unexpected phase helper insertion point')
          text = text.replace(marker, helper + marker)

          start = text.index('cf_find_rule_by_marker(){\n')
          end = text.index('\n\ncf_recover_pending_write(){', start)
          replacement = textwrap.dedent(r'''
          cf_find_rule_by_marker(){
            local zone_id="$1" phase="$2" ref="$3" marker="$4" entry rc ruleset_id exact_ids ref_ids id exact_count=0 ref_count=0 found=""
            if entry="$(cf_get_phase_entrypoint "$zone_id" "$phase")"; then
              ruleset_id="$(jq -r '.id' <<<"$entry")"
            else
              rc=$?
              [ "$rc" -eq 3 ] && return 1
              return 2
            fi
            exact_ids="$(jq -r --arg ref "$ref" --arg marker "$marker" '.rules[]? | select((.ref // "")==$ref and ((.description // "") | endswith(" txn:"+$marker))) | .id // empty' <<<"$entry")"
            ref_ids="$(jq -r --arg ref "$ref" '.rules[]? | select((.ref // "")==$ref) | .id // empty' <<<"$entry")"
            while IFS= read -r id; do [ -n "$id" ] || continue; found="$ruleset_id|$id"; exact_count=$((exact_count + 1)); done <<<"$exact_ids"
            while IFS= read -r id; do [ -n "$id" ] || continue; ref_count=$((ref_count + 1)); done <<<"$ref_ids"
            [ "$exact_count" -eq 1 ] && { printf '%s\n' "$found"; return 0; }
            [ "$exact_count" -eq 0 ] || return 2
            [ "$ref_count" -eq 0 ] && return 1
            return 2
          }
          ''').rstrip()
          text = text[:start] + replacement + text[end:]

          old_local = '  local list ruleset_id rule_ref ref_match rule_body create_body res ruleset marker pending_rule_body ruleset_desc verify_id rule current_fingerprint pending_fingerprint\n'
          new_local = '  local phase_entry rc ruleset_id rule_ref ref_match rule_body create_body res ruleset marker pending_rule_body ruleset_desc verify_id rule current_fingerprint pending_fingerprint\n'
          if text.count(old_local) != 2:
              raise SystemExit(f'unexpected reconcile local shape: {text.count(old_local)}')
          text = text.replace(old_local, new_local)

          old_origin = '''  list="$(cf_list_zone_rulesets "$zone_id")" || die "Cloudflare ruleset lookup failed."\n  ruleset_id="$(jq -r '.result[]? | select(.kind=="zone" and .phase=="http_request_origin") | .id' <<<"$list" | head -n1)"\n'''
          new_origin = '''  if phase_entry="$(cf_get_phase_entrypoint "$zone_id" http_request_origin)"; then\n    ruleset_id="$(jq -r '.id' <<<"$phase_entry")"\n    ruleset="$(jq -cn --argjson result "$phase_entry" '{success:true,result:$result}')"\n  else\n    rc=$?\n    [ "$rc" -eq 3 ] || die "Cloudflare Origin Rules entrypoint lookup failed."\n    ruleset_id=""\n  fi\n'''
          if text.count(old_origin) != 1:
              raise SystemExit('unexpected Origin Rules discovery shape')
          text = text.replace(old_origin, new_origin)
          reread = '    ruleset="$(cf_api GET "/zones/$zone_id/rulesets/$ruleset_id")" || die "Could not read Cloudflare Origin Rules ruleset."\n'
          if text.count(reread) != 1:
              raise SystemExit('unexpected Origin Rules reread shape')
          text = text.replace(reread, '')

          old_ssl = '''  list="$(cf_list_zone_rulesets "$zone_id")" || die "Cloudflare ruleset lookup failed."\n  ruleset_id="$(jq -r '.result[]? | select(.kind=="zone" and .phase=="http_config_settings") | .id' <<<"$list" | head -n1)"\n'''
          new_ssl = '''  if phase_entry="$(cf_get_phase_entrypoint "$zone_id" http_config_settings)"; then\n    ruleset_id="$(jq -r '.id' <<<"$phase_entry")"\n    ruleset="$(jq -cn --argjson result "$phase_entry" '{success:true,result:$result}')"\n  else\n    rc=$?\n    [ "$rc" -eq 3 ] || die "Cloudflare Configuration Rules entrypoint lookup failed."\n    ruleset_id=""\n  fi\n'''
          if text.count(old_ssl) != 1:
              raise SystemExit('unexpected Configuration Rules discovery shape')
          text = text.replace(old_ssl, new_ssl)
          reread = '    ruleset="$(cf_api GET "/zones/$zone_id/rulesets/$ruleset_id")" || die "Could not read Cloudflare Configuration Rules ruleset."\n'
          if text.count(reread) != 1:
              raise SystemExit('unexpected Configuration Rules reread shape')
          text = text.replace(reread, '')

          if 'cf_list_zone_rulesets' in text or '/rulesets?per_page=50' in text or 'rulesets?per_page=100' in text:
              raise SystemExit('zone-wide Rulesets discovery remains in production code')
          manage.write_text(text)

          discovery = Path('tests/cloudflare_rulesets_discovery.sh')
          discovery.write_text(textwrap.dedent(r'''
          #!/usr/bin/env bash
          set -Eeuo pipefail

          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          export AI_SERVER_AGENT_MANAGE_LIBRARY_ONLY=1
          # shellcheck source=../manage.sh
          source "$ROOT/manage.sh"

          CF_TOKEN=test
          CF_API="https://api.cloudflare.com/client/v4"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          CALL_LOG="$TMP/calls.log"
          fail(){ echo "FAIL: $*" >&2; exit 1; }

          if grep -Fq 'cf_list_zone_rulesets' "$ROOT/manage.sh" || grep -Fq '/rulesets?per_page=' "$ROOT/manage.sh"; then
            fail 'production code still depends on zone-wide Rulesets pagination'
          fi

          curl(){
            local url="${*: -1}"
            printf '%s\n' "$url" >> "$CALL_LOG"
            case "$url" in
              "$CF_API/zones/zone1/rulesets/phases/http_request_origin/entrypoint")
                printf '%s\n200' '{"success":true,"result":{"id":"origin-set","kind":"zone","phase":"http_request_origin","rules":[{"id":"r1","ref":"origin-ref"}]}}' ;;
              "$CF_API/zones/zone1/rulesets/phases/http_config_settings/entrypoint")
                printf '%s\n404' '{"success":false,"errors":[{"code":10000,"message":"entrypoint not found"}]}' ;;
              *) echo "unexpected curl URL: $url" >&2; return 22 ;;
            esac
          }

          origin="$(cf_get_phase_entrypoint zone1 http_request_origin)" || fail 'existing Origin Rules entrypoint was not discovered'
          [ "$(jq -r '.id' <<<"$origin")" = origin-set ] || fail 'wrong Origin Rules entrypoint ID'
          [ "$(jq -r '.phase' <<<"$origin")" = http_request_origin ] || fail 'wrong Origin Rules phase'
          grep -Fxq "$CF_API/zones/zone1/rulesets/phases/http_request_origin/entrypoint" "$CALL_LOG" || fail 'exact Origin Rules phase endpoint was not used'

          set +e
          cf_get_phase_entrypoint zone1 http_config_settings >/dev/null 2>&1
          rc=$?
          set -e
          [ "$rc" -eq 3 ] || fail "missing Configuration Rules entrypoint did not return absence status: $rc"

          before="$(wc -l < "$CALL_LOG")"
          set +e
          cf_get_phase_entrypoint zone1 http_request_snippets >/dev/null 2>&1
          rc=$?
          set -e
          [ "$rc" -eq 2 ] || fail 'unsupported internal phase input was not rejected'
          [ "$(wc -l < "$CALL_LOG")" -eq "$before" ] || fail 'unsupported phase input reached Cloudflare'

          for bad in \
            '{"success":true,"result":{"id":"","kind":"zone","phase":"http_request_origin","rules":[]}}' \
            '{"success":true,"result":{"id":"r1","kind":"root","phase":"http_request_origin","rules":[]}}' \
            '{"success":true,"result":{"id":"r1","kind":"zone","phase":"http_config_settings","rules":[]}}' \
            '{"success":true,"result":{"id":"r1","kind":"zone","phase":"http_request_origin","rules":{}}}'; do
            curl(){ printf '%s\n200' "$bad"; }
            if cf_get_phase_entrypoint zone1 http_request_origin >/dev/null 2>&1; then
              fail "malformed phase entrypoint was accepted: $bad"
            fi
          done

          curl(){ printf '%s\n403' '{"success":false,"errors":[{"code":9109,"message":"permission denied"}]}' ; }
          set +e
          err="$(cf_get_phase_entrypoint zone1 http_request_origin 2>&1 >/dev/null)"
          rc=$?
          set -e
          [ "$rc" -eq 2 ] || fail 'non-404 phase lookup failure was treated as absence'
          grep -Fq 'Cloudflare API error 9109: permission denied' <<<"$err" || fail 'structured Cloudflare phase lookup error was hidden'
          if grep -Fq 'Bearer test' <<<"$err"; then fail 'Cloudflare token leaked into diagnostics'; fi

          printf 'Cloudflare Rulesets phase-entrypoint discovery contract passed.\n'
          ''').lstrip())
          discovery.chmod(0o755)
          Path('tests/cloudflare_rulesets_pagination.sh').unlink()

          txn = Path('tests/cloudflare_transaction.sh')
          t = txn.read_text()
          old = 'cf_list_zone_rulesets(){ printf \'%s\' \'{"success":true,"result":[{"id":"origin-set-race","kind":"zone","phase":"http_request_origin"}]}\' ; }\n'
          new = 'cf_get_phase_entrypoint(){ printf \'%s\' \'{"id":"origin-set-race","kind":"zone","phase":"http_request_origin","rules":[{"id":"external-origin","ref":"ai_server_agent_test","description":"AI Server Agent origin port"}]}\' ; }\n'
          if t.count(old) != 1:
              raise SystemExit('unexpected Origin recovery fixture shape')
          t = t.replace(old, new)

          old = 'cf_list_zone_rulesets(){ printf \'%s\' \'{"success":true,"result":[{"id":"ssl-set-owned","kind":"zone","phase":"http_config_settings"}]}\' ; }\n'
          new = 'cf_get_phase_entrypoint(){ jq -nc --argjson rule "$ssl_rule_json" \'{id:"ssl-set-owned",kind:"zone",phase:"http_config_settings",rules:[$rule]}\' ; }\n'
          if t.count(old) != 1:
              raise SystemExit('unexpected SSL fixture shape')
          t = t.replace(old, new)
          txn.write_text(t)
          PY

          bash -n manage.sh tests/cloudflare_transaction.sh tests/cloudflare_rulesets_discovery.sh
          sudo bash tests/cloudflare_transaction.sh
          bash tests/cloudflare_rulesets_discovery.sh
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manage.sh tests/cloudflare_transaction.sh tests/cloudflare_rulesets_discovery.sh tests/cloudflare_rulesets_pagination.sh
          git commit -m 'refactor: discover exact Cloudflare phase entrypoints'
          git push origin HEAD:fix/cloudflare-rulesets-contract-v2
