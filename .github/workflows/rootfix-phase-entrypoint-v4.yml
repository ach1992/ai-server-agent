name: Rootfix Phase Entrypoint v4

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/cloudflare-rulesets-contract-v2'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-rulesets-contract-v2
          fetch-depth: 0
      - name: Apply and validate phase-entrypoint root fix
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/rootfix-phase-status.py
          bash /tmp/rootfix-phase.sh
