name: CI
on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-once:
    if: github.head_ref == 'fix/rulesets-contract-v014'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rulesets-contract-v014
          fetch-depth: 0
      - name: Apply phase-entrypoint root fix and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-rulesets-entrypoint-fix.py
          bash -n manage.sh tests/cloudflare_rulesets_pagination.sh tests/cloudflare_transaction.sh tests/cloudflare_crash_recovery.sh tests/cloudflare_phase_recovery.sh
          bash tests/cloudflare_rulesets_pagination.sh
          sudo bash tests/cloudflare_transaction.sh
          sudo bash tests/cloudflare_crash_recovery.sh
          sudo bash tests/cloudflare_phase_recovery.sh
          git diff --check
      - name: Restore trusted CI and push final candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          sed -i 's/RELEASE_VERSION: v0.1.3/RELEASE_VERSION: v0.1.4/' .github/workflows/ci.yml
          test "$(grep -Fc 'RELEASE_VERSION: v0.1.4' .github/workflows/ci.yml)" -eq 1
          git rm scripts/apply-rulesets-entrypoint-fix.py
          git add manage.sh tests/cloudflare_rulesets_pagination.sh tests/cloudflare_transaction.sh .github/workflows/ci.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: use Cloudflare Rulesets phase entrypoints'
          git push origin HEAD:fix/rulesets-contract-v014
