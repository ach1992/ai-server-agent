name: CI
run-name: "CI ${{ github.event_name }} PR:${{ github.event.pull_request.number || 'none' }} REF:${{ github.event.pull_request.base.ref || 'none' }} BASE:${{ github.event.pull_request.base.sha || 'none' }} HEAD:${{ github.event.pull_request.head.sha || github.sha }}"
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
env:
  RELEASE_VERSION: v0.1.9
jobs:
  change-scope:
    name: CI change scope
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      runtime_changed: ${{ steps.scope.outputs.runtime_changed }}
      reuse_validated_pr: ${{ steps.reuse.outputs.reuse_validated_pr }}
      go_changed: ${{ steps.scope.outputs.go_changed }}
      shell_changed: ${{ steps.scope.outputs.shell_changed }}
      cloudflare_security_changed: ${{ steps.scope.outputs.cloudflare_security_changed }}
      root_trust_security_changed: ${{ steps.scope.outputs.root_trust_security_changed }}
      stable_provenance_changed: ${{ steps.scope.outputs.stable_provenance_changed }}
      stable_update_trust_changed: ${{ steps.scope.outputs.stable_update_trust_changed }}
      platform_changed: ${{ steps.scope.outputs.platform_changed }}
      arm64_lifecycle_changed: ${{ steps.scope.outputs.arm64_lifecycle_changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate change-scope and reuse proofs
        run: |
          for source in scripts/ci-change-scope.sh tests/ci_change_scope.sh scripts/ci-reuse-pr-validation.sh tests/ci_pr_validation_reuse.sh; do
            bash -n "$source"
          done
          bash tests/ci_change_scope.sh
          bash tests/ci_pr_validation_reuse.sh
      - name: Classify changed paths
        id: scope
        run: bash scripts/ci-change-scope.sh >> "$GITHUB_OUTPUT"
      - name: Reuse validated exact-tree PR evidence on squash-merged main
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-reuse-pr-validation.sh >> "$GITHUB_OUTPUT"

  test:
    needs: change-scope
    if: ${{ always() && needs.change-scope.outputs.reuse_validated_pr != 'true' && (needs.change-scope.result != 'success' || needs.change-scope.outputs.runtime_changed != 'false') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Require successful change classification
        run: test "${{ needs.change-scope.result }}" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Format
        if: ${{ needs.change-scope.outputs.go_changed != 'false' }}
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:" >&2
            printf '%s\n' "$unformatted" >&2
            echo "gofmt diff:" >&2
            while IFS= read -r file; do
              gofmt -d "$file" >&2
            done <<< "$unformatted"
            exit 1
          fi
      - name: Vet
        if: ${{ needs.change-scope.outputs.go_changed != 'false' }}
        run: go vet ./...
      - name: Unit tests
        if: ${{ needs.change-scope.outputs.go_changed != 'false' }}
        run: go test -race -vet=off ./...
      - name: Build static binary
        if: ${{ needs.change-scope.outputs.go_changed != 'false' || needs.change-scope.outputs.root_trust_security_changed != 'false' }}
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/ai-server-agent ./cmd/ai-server-agent
      - name: Shell syntax
        if: ${{ needs.change-scope.outputs.shell_changed != 'false' }}
        run: bash -n install.sh update.sh uninstall.sh manage.sh ensure-lifecycle-lock.sh scripts/build-release.sh scripts/install-stable.sh scripts/ci-change-scope.sh scripts/dev-check.sh tests/*.sh

      - name: Validate authenticated credential activation response
        run: bash tests/credential_activation_response.sh
      - name: GitHub Actions immutable pinning contract
        run: |
          bad=0
          while IFS= read -r ref; do
            if [[ "$ref" == ./* ]]; then
              continue
            fi
            if [[ ! "$ref" =~ @[0-9a-f]{40}$ ]]; then
              echo "GitHub Action is not pinned to a full commit SHA: $ref" >&2
              bad=1
            fi
          done < <(sed -nE 's/^[[:space:]]*- uses:[[:space:]]+([^[:space:]#]+).*/\1/p' .github/workflows/*.yml)
          test "$bad" -eq 0
      - name: Root shell execution boundary
        if: ${{ needs.change-scope.outputs.root_trust_security_changed != 'false' }}
        run: |
          if grep -nE 'exec.Command\("/bin/bash", "-lc"|"/bin/bash", "-lc", shell|--setenv=HOME=' internal/executor/executor.go internal/executor/foundation.go internal/executor/jobs.go; then
            echo 'executor must not use login shells or inherited workspace HOME for privileged execution' >&2
            exit 1
          fi
          grep -qF 'exec.CommandContext(ctx, "/bin/bash", "--noprofile", "--norc", "-s")' internal/executor/foundation.go
          grep -qF 'cmd.Stdin = strings.NewReader(command)' internal/executor/foundation.go
          grep -qF 'newBoundedOutputCollector(maxSyncOutputBytes)' internal/executor/foundation.go
          if grep -qF 'bytes.Buffer' internal/executor/foundation.go; then
            echo 'synchronous command output must not use an unbounded bytes.Buffer' >&2
            exit 1
          fi
          grep -qF 'Setpgid: true' internal/executor/foundation.go
          grep -qF 'syscall.Kill(-pgid, syscall.SIGTERM)' internal/executor/foundation.go
          grep -qF 'syscall.Kill(-pgid, syscall.SIGKILL)' internal/executor/foundation.go
          grep -qF '"/usr/bin/env", "-i"' internal/executor/jobs.go
          grep -qF 'runnerPath, "job-runner"' internal/executor/jobs.go
          grep -qF 'jobStateSafetyReserveBytes' internal/executor/jobs.go
          grep -qF 'lifecycleManagementLockPath' internal/executor/jobs.go
          grep -qF 'syscall.LOCK_SH|syscall.LOCK_NB' internal/executor/jobs.go
          grep -qF 'removeTerminalCommandHandoff' internal/executor/jobs.go
          grep -Eq 'OperationID[[:space:]]+string' internal/executor/protocol.go
      - name: Installer compatibility check
        if: ${{ needs.change-scope.outputs.platform_changed != 'false' || needs.change-scope.outputs.root_trust_security_changed != 'false' || needs.change-scope.outputs.stable_provenance_changed != 'false' }}
        run: sudo bash install.sh --check
      - name: Supported platform policy
        if: ${{ needs.change-scope.outputs.platform_changed != 'false' }}
        run: bash tests/platform_compatibility.sh
      - name: Guided installer and management contract
        if: ${{ needs.change-scope.outputs.root_trust_security_changed != 'false' || needs.change-scope.outputs.cloudflare_security_changed != 'false' }}
        run: |
          grep -qF 'MANAGE_BIN="/usr/local/sbin/ai-server-agent-manage"' install.sh
          grep -qF 'AI_SERVER_AGENT_SETUP_MODE' install.sh
          grep -qF 'if ! "$MANAGE_BIN" first-run; then' install.sh
          grep -qF 'SETUP_INCOMPLETE=1' install.sh
          grep -qF 'Core installation succeeded, but connection setup was not completed.' install.sh
          grep -qF 'Resume setup with: sudo ai-server-agent-manage' install.sh
          grep -qF 'Configure later - keep the healthy local Agent' manage.sh
          grep -qF 'ca-certificates curl git jq openssl tar xz-utils' install.sh
          grep -qF 'CONTROL_DIR="$CONFIG_DIR/control"' install.sh
          grep -qF 'INSTALL_STATE="$CONTROL_DIR/install-state.json"' install.sh
          grep -qF "'{channel:\$channel,version:\$version,ref:\$ref,track_ref:\$track_ref}'" install.sh
          if grep -Eq '(^|[[:space:]])(\.|source)[[:space:]]+"\$INSTALL_STATE"' update.sh manage.sh; then
            echo 'root-trusted install state must never be shell-sourced' >&2
            exit 1
          fi
          grep -qF 'Status / health' manage.sh
          grep -qF 'ChatGPT setup' manage.sh
          grep -qF 'Configure or change domain / connection' manage.sh
          grep -qF 'Rotate / renew Cloudflare TLS certificate' manage.sh
          grep -qF 'Safe uninstall (preserve data)' manage.sh
          grep -qF 'Purge Agent-owned server data' manage.sh
          grep -qF 'Remove recorded Cloudflare resources' manage.sh
      - name: Browser trust-boundary static contract
        if: ${{ needs.change-scope.outputs.go_changed != 'false' }}
        run: grep -qF 'Refusing symlinked browser data directory' internal/browser/browser.go
      - name: Root trust-boundary static contract
        if: ${{ needs.change-scope.outputs.root_trust_security_changed != 'false' }}
        run: |
          grep -qF 'install -d -m 0700 -o root -g root "$CONTROL_DIR"' install.sh
          grep -qF 'install -d -m 0711 -o root -g root "$STATE_DIR"' install.sh
          grep -qF 'secure_state_container "$STATE_DIR/runtime"' install.sh
          grep -qF 'secure_state_container "$STATE_DIR/jobs"' install.sh
          grep -qF 'find "$STATE_DIR/jobs" -mindepth 1 -maxdepth 1 -type l -delete' install.sh
          grep -qF 'ReadWritePaths=$STATE_DIR/AI_ENVIRONMENT.json' install.sh
          grep -qF 'DEFAULT_INSTALL_STATE="/etc/ai-server-agent/control/install-state.json"' update.sh
          grep -qF 'CF_TXN_STATE="$CONTROL_DIR/cloudflare-transaction.json"' manage.sh
          grep -qF 'MANAGEMENT_LOCK="/run/lock/ai-server-agent/management.lock"' manage.sh
          grep -qF 'flock -n "$MANAGEMENT_LOCK_FD"' manage.sh
          grep -qF 'dns_record_fingerprint' manage.sh
          grep -qF 'origin_rule_fingerprint' manage.sh
          grep -qF 'ssl_config_rule_fingerprint' manage.sh
          grep -qF 'install -d -o root -g root -m 0700 "$CONTROL_DIR"' manage.sh
          grep -qF 'chmod 0600 "$tmp"' manage.sh
          grep -qF 'syscall.O_NOFOLLOW' internal/executor/executor.go
          grep -qF 'trustedDir(jobsDir)' internal/executor/jobs.go
          grep -qF 'job path is not a regular file' internal/executor/executor.go
          grep -qF 'AUDIT_FINGERPRINT_KEY="$CONFIG_DIR/audit-fingerprint.key"' install.sh
          grep -qF 'chmod 0600 "$AUDIT_FINGERPRINT_KEY"' install.sh
          grep -qF 'NewWithKeyAndReserve' internal/executor/executor.go
          grep -qF 'os.O_WRONLY|os.O_CREATE|os.O_APPEND|syscall.O_NOFOLLOW' internal/audit/audit.go
          grep -qF 'Refusing symlinked browser data directory' internal/browser/browser.go
      - name: Cloudflare guided setup safety contract
        if: ${{ needs.change-scope.outputs.cloudflare_security_changed != 'false' }}
        run: |
          grep -qF 'read -r -s CF_TOKEN' manage.sh
          grep -qF 'Cloudflare API token (input hidden; not stored)' manage.sh
          grep -qF 'Zone resource: Include -> Specific zone' manage.sh
          grep -qF 'Account resource: Include -> Specific account' manage.sh
          grep -qF 'Zone > Zone > Read' manage.sh
          grep -qF 'Zone > DNS > Edit' manage.sh
          grep -qF 'Zone > SSL and Certificates > Edit' manage.sh
          grep -qF 'Zone > Origin Rules > Edit' manage.sh
          grep -qF 'Zone > Config Rules > Edit' manage.sh
          grep -qF 'Account > Account Rulesets > Read' manage.sh
          grep -qF 'Do not paste the token into ChatGPT' manage.sh
          grep -qF "cf_api POST '/certificates'" manage.sh
          grep -qF '/dns_records' manage.sh
          grep -qF 'http_request_origin' manage.sh
          grep -qF 'origin:{port:$port}' manage.sh
          grep -qF 'http_config_settings' manage.sh
          grep -qF 'action:"set_config"' manage.sh
          grep -qF 'action_parameters:{ssl:"strict"}' manage.sh
          grep -qF 'ssl_config_ruleset_id' manage.sh
          grep -qF 'ssl_config_rule_id' manage.sh
          grep -qF 'Refusing to adopt or overwrite it' manage.sh
          grep -qF 'Refusing ambiguous replacement' manage.sh
          grep -qF 'dns_record_owned' manage.sh
          grep -qF '[ "$content" = "$ip" ] && [ "$proxied" = "true" ] || die "Existing A record for $host is not recorded as Agent-owned and does not match this server. Refusing to modify or adopt it automatically.' manage.sh
          grep -qF 'delete_recorded_cloudflare_resources(){' manage.sh
          grep -qF 'cf_delete_owned(){' manage.sh
          grep -qF 'Refusing to adopt or modify the replacement record.' manage.sh
          grep -qF 'Refusing to modify or adopt it automatically.' manage.sh
          grep -qF 'cf_delete_dns_if_expected(){' manage.sh
          grep -qF 'cf_delete_rule_if_expected(){' manage.sh
          grep -qF 'different Cloudflare zone' manage.sh
          grep -qF 'resource drift was detected' manage.sh
          grep -qF 'CF_TXN_STATE="$CONTROL_DIR/cloudflare-transaction.json"' manage.sh
          grep -qF 'save_cloudflare_transaction_state(){' manage.sh
          grep -qF 'cloudflare_transaction_exit(){' manage.sh
          grep -qF 'Cloudflare rollback was incomplete. Exact remaining ownership/recovery state was preserved in $CF_TXN_STATE.' manage.sh
          grep -qF 'cloudflare_previous_certificate' manage.sh
          grep -qF 'transaction rollback started.' manage.sh
          grep -qF 'Recovery state remains in $CF_TXN_STATE.' manage.sh
          if grep -qF '/settings/ssl' manage.sh; then
            echo 'guided Cloudflare setup must not modify whole-zone SSL mode' >&2
            exit 1
          fi
          if grep -qF 'AI_SERVER_AGENT_ALLOW_ZONE_SSL_CHANGE' manage.sh; then
            echo 'whole-zone SSL mutation fallback must not be present in normal setup' >&2
            exit 1
          fi
          if grep -qF 'AI_SERVER_AGENT_REPLACE_EXISTING_DNS' manage.sh; then
            echo 'external DNS records must not be auto-adopted or overwritten' >&2
            exit 1
          fi
          if grep -Eq 'managed\.json.*(TOKEN|token)|CLOUDFLARE_API_TOKEN.*managed' manage.sh; then
            echo 'Cloudflare credentials must not be persisted in managed state' >&2
            exit 1
          fi
      - name: Cloudflare Rulesets pagination contract
        if: ${{ needs.change-scope.outputs.cloudflare_security_changed != 'false' }}
        run: bash tests/cloudflare_rulesets_pagination.sh
      - name: Stable update channel contract
        if: ${{ needs.change-scope.outputs.stable_update_trust_changed != 'false' }}
        run: |
          state="$(mktemp)"
          cat > "$state" <<'STATE'
          {"channel":"stable","version":"v0.1.1","ref":"v0.1.1","track_ref":"v0.1.1"}
          STATE
          sudo env \
            AI_SERVER_AGENT_INSTALL_STATE="$state" \
            AI_SERVER_AGENT_VERSION="$RELEASE_VERSION" \
            bash update.sh --plan > /tmp/stable-plan.out
          grep -qF 'Update channel: stable' /tmp/stable-plan.out
          grep -qF "Target version: $RELEASE_VERSION" /tmp/stable-plan.out
          grep -qF "Target ref: $RELEASE_VERSION" /tmp/stable-plan.out
          if grep -qF 'Target ref: main' /tmp/stable-plan.out; then
            echo 'stable update must never default to main' >&2
            exit 1
          fi
      - name: Installer restart contract
        if: ${{ needs.change-scope.outputs.root_trust_security_changed != 'false' }}
        run: |
          daemon_line="$(grep -nF 'systemctl daemon-reload' install.sh | cut -d: -f1 | head -n1)"
          enable_line="$(grep -nF 'systemctl enable ai-server-agent-executor.service ai-server-agent.service' install.sh | cut -d: -f1 | head -n1)"
          restart_line="$(grep -nF 'systemctl restart ai-server-agent-executor.service ai-server-agent.service' install.sh | cut -d: -f1 | awk -v after="$enable_line" '$1 > after { print $1; exit }')"
          active_line="$(grep -nF 'systemctl is-active --quiet ai-server-agent-executor.service' install.sh | cut -d: -f1 | awk -v after="$restart_line" '$1 > after { print $1; exit }')"
          grep -qF 'ExecStartPre=$LIB_DIR/ensure-lifecycle-lock.sh' install.sh
          grep -qF 'ensure-lifecycle-lock.sh' scripts/build-release.sh
          bash -n ensure-lifecycle-lock.sh
          test -n "$daemon_line" && test -n "$enable_line" && test -n "$restart_line" && test -n "$active_line"
          test "$enable_line" -gt "$daemon_line"
          test "$restart_line" -gt "$enable_line"
          test "$active_line" -gt "$restart_line"
      - name: Local MCP authentication contract
        if: ${{ needs.change-scope.outputs.root_trust_security_changed != 'false' }}
        run: |
          grep -qF 'AUTH_MODE="bearer"' install.sh
          grep -qF 'MCP_CREDENTIAL_STORE="$CONFIG_DIR/mcp-credentials.json"' install.sh
          grep -qF '"credential_store_file": "$MCP_CREDENTIAL_STORE"' install.sh
          grep -qF 'verifier_algorithm:"sha256-v1"' install.sh
          grep -qF 'rm -f -- "$LEGACY_MCP_TOKEN_FILE" "$MCP_AUTH_HEADER_FILE"' install.sh
          if grep -qF 'AUTH_MODE="none"' install.sh; then
            echo 'loopback MCP must not disable authentication' >&2
            exit 1
          fi
      - name: Generated token formatting contract
        if: ${{ needs.change-scope.outputs.root_trust_security_changed != 'false' }}
        run: |
          token_file="$(mktemp)"
          trap 'rm -f "$token_file"' EXIT
          test "$(grep -c '^random_hex(){' install.sh)" -eq 1
          eval "$(grep '^random_hex(){' install.sh)"
          random_hex > "$token_file"
          test "$(wc -c < "$token_file")" -eq 65
          grep -Eq '^[0-9a-f]{64}$' "$token_file"
          test "$(tr -cd '\n' < "$token_file" | wc -c)" -eq 1
          test "$(tail -c 1 "$token_file" | od -An -tu1 | tr -d '[:space:]')" = "10"
      - name: Native TLS public-mode contract
        if: ${{ needs.change-scope.outputs.root_trust_security_changed != 'false' }}
        run: |
          grep -qF 'Public mode requires native TLS.' install.sh || grep -qF 'Public mode requires native TLS' install.sh
          grep -qF '"tls_cert_file": "$TLS_CERT_FILE"' install.sh
          grep -qF '"tls_key_file": "$TLS_KEY_FILE"' install.sh
          grep -qF 'write_config public' manage.sh
          grep -qF 'ServeTLS(cfg)' cmd/ai-server-agent/main.go
          if sudo env AI_SERVER_AGENT_BIND_MODE=public AI_SERVER_AGENT_NONINTERACTIVE=1 bash install.sh >/tmp/public-no-tls.out 2>&1; then
            echo 'public mode unexpectedly accepted plaintext configuration' >&2
            cat /tmp/public-no-tls.out >&2
            exit 1
          fi
          grep -qF 'Public mode requires native TLS' /tmp/public-no-tls.out
          if grep -Eq 'apt-get install.*(nginx|apache2|caddy|cloudflared)' install.sh; then
            echo 'Agent installer must not add a web proxy or tunnel daemon' >&2
            exit 1
          fi
      - name: Source ref resolution contract
        if: ${{ needs.change-scope.outputs.stable_update_trust_changed != 'false' || needs.change-scope.outputs.stable_provenance_changed != 'false' }}
        run: |
          bash tests/source_ref_resolution.sh
          grep -qF 'https://api.github.com/repos/$REPO/tarball/$RESOLVED_SOURCE_REF' install.sh
          grep -qF -- '--data-urlencode "ref=$TARGET_REF"' update.sh
          if grep -qF 'TARGET_REF=main' update.sh; then
            echo 'update.sh must not hard-code main as a stable target' >&2
            exit 1
          fi
      - name: Release artifact installer contract
        if: ${{ github.event_name == 'push' || needs.change-scope.outputs.stable_provenance_changed != 'false' }}
        run: |
          rm -rf dist
          bash scripts/build-release.sh "$RELEASE_VERSION"
          version="${RELEASE_VERSION#v}"
          mapfile -t arches < <(grep -Ev '^[[:space:]]*(#|$)' scripts/release-arches.txt)
          test "${#arches[@]}" -gt 0
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq "${#arches[@]}"
          test "$(wc -l < dist/SHA256SUMS)" -eq "${#arches[@]}"
          test -x dist/install.sh
          for arch in "${arches[@]}"; do
            archive="dist/ai-server-agent_${version}_linux_${arch}.tar.gz"
            root="ai-server-agent_${version}_linux_${arch}"
            test -f "$archive"
            grep -qF "  ai-server-agent_${version}_linux_${arch}.tar.gz" dist/SHA256SUMS
            tar -tzf "$archive" | grep -qF "$root/ai-server-agent"
            tar -tzf "$archive" | grep -qF "$root/manage.sh"
            tar -tzf "$archive" | grep -qF "$root/update.sh"
            tar -tzf "$archive" | grep -qF "$root/uninstall.sh"
            tar -tzf "$archive" | grep -qF "$root/ensure-lifecycle-lock.sh"
            tar -tzf "$archive" | grep -qF "$root/README.md"
            tar -tzf "$archive" | grep -qF "$root/LICENSE"
          done
          grep -qF "export AI_SERVER_AGENT_VERSION=$RELEASE_VERSION" dist/install.sh
          grep -qF "export AI_SERVER_AGENT_REF=$RELEASE_VERSION" dist/install.sh
          grep -qF 'curl -fsSL "$url/$asset"' dist/install.sh
          grep -qF 'curl -fsSL "$url/SHA256SUMS"' dist/install.sh
          grep -qF 'sha256sum -c -' dist/install.sh
          (cd dist && sha256sum -c SHA256SUMS)
          sudo bash dist/install.sh --check
          git diff --exit-code -- internal/mcp/server.go
      - name: Ubuntu 22.04 amd64 lifecycle validation
        if: ${{ needs.change-scope.outputs.root_trust_security_changed != 'false' }}
        run: |
          test "$(uname -m)" = 'x86_64'
          grep -qF 'Ubuntu 22.04' /etc/os-release
          sudo env AI_SERVER_AGENT_BINARY=/tmp/ai-server-agent AI_SERVER_AGENT_NONINTERACTIVE=1 bash install.sh
          sudo systemctl is-active --quiet ai-server-agent.service
          sudo systemctl is-active --quiet ai-server-agent-executor.service
          sudo test -x /usr/local/sbin/ai-server-agent-manage
          sudo test -x /usr/local/lib/ai-server-agent/update.sh
          sudo test -x /usr/local/lib/ai-server-agent/ensure-lifecycle-lock.sh
          sudo jq -e '.channel == "source" and .version == "source"' /etc/ai-server-agent/control/install-state.json >/dev/null
          sudo bash tests/root_trust_boundary.sh

          # Model a reboot-cleared /run namespace. Executor startup must recreate
          # the root-only lifecycle lock before persistent-job admission is served.
          sudo systemctl stop ai-server-agent.service ai-server-agent-executor.service
          sudo rm -rf /run/lock/ai-server-agent
          sudo systemctl start ai-server-agent-executor.service ai-server-agent.service
          sudo systemctl is-active --quiet ai-server-agent-executor.service
          sudo systemctl is-active --quiet ai-server-agent.service
          test "$(sudo stat -c '%u:%g:%a' /run/lock/ai-server-agent)" = '0:0:700'
          test "$(sudo stat -c '%u:%g:%a' /run/lock/ai-server-agent/management.lock)" = '0:0:600'

          # Exercise the installed production executor path after volatile-state
          # recovery. The probe starts a real worker job and immediately stops it.
          rm -rf ci-start-job-probe
          mkdir ci-start-job-probe
          cat > ci-start-job-probe/main.go <<'EOF_GO_PROBE'
          package main

          import (
              "context"
              "fmt"
              "os"
              "strings"
              "time"

              "github.com/ach1992/ai-server-agent/internal/config"
              "github.com/ach1992/ai-server-agent/internal/executor"
          )

          func main() {
              cfg, err := config.Load("/etc/ai-server-agent/config.json")
              if err != nil {
                  panic(err)
              }
              tokenBytes, err := os.ReadFile(cfg.ExecutorToken)
              if err != nil {
                  panic(err)
              }
              ctx, cancel := context.WithTimeout(context.Background(), 15*time.Second)
              defer cancel()
              resp, err := executor.ClientCallContext(ctx, cfg.ExecutorSocket, strings.TrimSpace(string(tokenBytes)), executor.Request{
                  Action: "start_job",
                  Command: "sleep 30",
                  OperationID: "ci-post-volatile-runtime-recovery",
              })
              if err != nil {
                  panic(err)
              }
              if !resp.OK || resp.Status != "accepted" || resp.JobID == "" {
                  panic(fmt.Sprintf("post-reboot start_job failed: %+v", resp))
              }
              stop, err := executor.ClientCallContext(ctx, cfg.ExecutorSocket, strings.TrimSpace(string(tokenBytes)), executor.Request{Action: "job_stop", JobID: resp.JobID})
              if err != nil {
                  panic(err)
              }
              if !stop.OK {
                  panic(fmt.Sprintf("post-reboot job cleanup failed: %+v", stop))
              }
          }
          EOF_GO_PROBE
          go build -o /tmp/ai-server-agent-start-job-probe ./ci-start-job-probe
          rm -rf ci-start-job-probe
          sudo /tmp/ai-server-agent-start-job-probe
          rm -f /tmp/ai-server-agent-start-job-probe

          audit_log=/var/log/ai-server-agent/audit.jsonl
          sudo test -s "$audit_log"
          test "$(sudo stat -c '%U:%G:%a' "$audit_log")" = "root:aiagent:640"
          if sudo grep -qF 'sleep 30' "$audit_log"; then
            echo 'raw persistent-job command leaked into audit log' >&2
            exit 1
          fi
          sudo jq -s -e '
            [.[] | select(.operation_id=="ci-post-volatile-runtime-recovery")] as $events
            | ($events | length) == 2
            and ($events | map(.schema_version == 2) | all)
            and ($events | map(.request_id | type == "string" and length > 0) | all)
            and ($events | map(.command_fingerprint | type == "string" and length == 64) | all)
            and ($events | map(.fingerprint_key_version == 1) | all)
            and ($events | map(.fingerprint_key_id | type == "string" and length > 0) | all)
            and ($events | map(.phase) | sort) == ["complete","start"]
          ' "$audit_log" >/dev/null

          # Unsafe volatile state must fail closed; startup must not follow or
          # repair a symlink supplied at the lifecycle-lock path.
          sudo systemctl stop ai-server-agent.service ai-server-agent-executor.service
          sudo rm -rf /run/lock/ai-server-agent
          sudo ln -s /tmp /run/lock/ai-server-agent
          if sudo systemctl start ai-server-agent-executor.service; then
            echo 'executor startup unexpectedly accepted a symlinked lifecycle lock namespace' >&2
            exit 1
          fi
          sudo test -L /run/lock/ai-server-agent
          sudo rm -f /run/lock/ai-server-agent
          sudo systemctl reset-failed ai-server-agent-executor.service
          sudo systemctl start ai-server-agent-executor.service ai-server-agent.service
          sudo systemctl is-active --quiet ai-server-agent-executor.service
          sudo systemctl is-active --quiet ai-server-agent.service
          test "$(sudo stat -c '%u:%g:%a' /run/lock/ai-server-agent)" = '0:0:700'
          test "$(sudo stat -c '%u:%g:%a' /run/lock/ai-server-agent/management.lock)" = '0:0:600'
          sudo touch /etc/ai-server-agent/lifecycle-config-sentinel
          sudo touch /var/lib/ai-server-agent/lifecycle-state-sentinel
          sudo touch /var/log/ai-server-agent/lifecycle-log-sentinel
          sudo install -d -m 0750 -o root -g aiagent /opt/ai-server-agent
          sudo touch /opt/ai-server-agent/lifecycle-runtime-sentinel
          sudo -u aiworker touch /srv/ai-workspace/lifecycle-workspace-sentinel

          sudo rm -f /tmp/ai-server-agent-shared-lifecycle-ready
          sudo bash -c 'exec 8>>/run/lock/ai-server-agent/management.lock; flock -s 8; touch /tmp/ai-server-agent-shared-lifecycle-ready; sleep 5' &
          lifecycle_holder=$!
          for _ in {1..20}; do
            if sudo test -e /tmp/ai-server-agent-shared-lifecycle-ready; then
              break
            fi
            sleep 0.25
          done
          sudo test -e /tmp/ai-server-agent-shared-lifecycle-ready
          if sudo env AI_SERVER_AGENT_YES=1 bash uninstall.sh >/tmp/uninstall-shared-lock.out 2>&1; then
            echo 'uninstall must not overlap a persistent-job admission/launch shared lifecycle lock' >&2
            exit 1
          fi
          grep -qF 'Another AI Server Agent management operation is already active' /tmp/uninstall-shared-lock.out
          wait "$lifecycle_holder"
          sudo rm -f /tmp/ai-server-agent-shared-lifecycle-ready
          sudo systemctl is-active --quiet ai-server-agent.service
          sudo systemctl is-active --quiet ai-server-agent-executor.service

          sudo systemd-run --unit ai-job-ci-uninstall-guard --collect /bin/sleep 120
          sudo systemctl is-active --quiet ai-job-ci-uninstall-guard.service
          if sudo env AI_SERVER_AGENT_YES=1 bash uninstall.sh >/tmp/uninstall-active-job.out 2>&1; then
            echo 'uninstall must refuse while an Agent persistent job is active' >&2
            exit 1
          fi
          grep -qF 'Active AI Server Agent persistent jobs exist' /tmp/uninstall-active-job.out
          sudo systemctl is-active --quiet ai-job-ci-uninstall-guard.service
          sudo systemctl stop ai-job-ci-uninstall-guard.service
          guard_units=
          for _ in {1..10}; do
            guard_units="$(sudo systemctl list-units --type=service --state=activating,active,deactivating,reloading --no-legend --no-pager 'ai-job-*.service' 2>/dev/null || true)"
            if [ -z "$(printf '%s\n' "$guard_units" | sed '/^[[:space:]]*$/d')" ]; then
              break
            fi
            sleep 1
          done
          if [ -n "$(printf '%s\n' "$guard_units" | sed '/^[[:space:]]*$/d')" ]; then
            echo 'persistent-job uninstall guard fixture did not leave all active lifecycle states cleanly' >&2
            printf '%s\n' "$guard_units" >&2
            exit 1
          fi

          audit_key_before="$(sudo sha256sum /etc/ai-server-agent/audit-fingerprint.key | awk '{print $1}')"
          test "$(sudo stat -c '%U:%G:%a' /etc/ai-server-agent/audit-fingerprint.key)" = "root:root:600"
          instance_id_before="$(sudo jq -er '.instance_id' /etc/ai-server-agent/config.json)"
          [[ "$instance_id_before" =~ ^asa_[0-9a-f]{32}$ ]]
          sudo env AI_SERVER_AGENT_YES=1 bash uninstall.sh
          test ! -e /usr/local/bin/ai-server-agent
          test ! -e /usr/local/sbin/ai-server-agent-manage
          test ! -e /usr/local/lib/ai-server-agent
          test ! -e /etc/systemd/system/ai-server-agent.service
          test ! -e /etc/systemd/system/ai-server-agent-executor.service
          sudo test -e /etc/ai-server-agent/lifecycle-config-sentinel
          sudo test -e /var/lib/ai-server-agent/lifecycle-state-sentinel
          sudo test -e /var/log/ai-server-agent/lifecycle-log-sentinel
          sudo test -e /opt/ai-server-agent/lifecycle-runtime-sentinel
          sudo test -s /etc/ai-server-agent/mcp-credentials.json
          sudo test ! -e /etc/ai-server-agent/mcp.token
          sudo test ! -e /etc/ai-server-agent/mcp.authorization
          sudo test -s /etc/ai-server-agent/audit-fingerprint.key
          test "$(sudo sha256sum /etc/ai-server-agent/audit-fingerprint.key | awk '{print $1}')" = "$audit_key_before"
          sudo test -e /srv/ai-workspace/lifecycle-workspace-sentinel
          id aiagent >/dev/null
          getent group aiagent >/dev/null
          id aiworker >/dev/null
          getent group aiworker >/dev/null

          sudo env AI_SERVER_AGENT_BINARY=/tmp/ai-server-agent AI_SERVER_AGENT_NONINTERACTIVE=1 bash install.sh
          sudo systemctl is-active --quiet ai-server-agent.service
          sudo systemctl is-active --quiet ai-server-agent-executor.service
          sudo test -s /etc/ai-server-agent/audit-fingerprint.key
          test "$(sudo sha256sum /etc/ai-server-agent/audit-fingerprint.key | awk '{print $1}')" = "$audit_key_before"
          test "$(sudo jq -er '.instance_id' /etc/ai-server-agent/config.json)" = "$instance_id_before"
          sudo test -e /srv/ai-workspace/lifecycle-workspace-sentinel

          sudo env AI_SERVER_AGENT_YES=1 bash uninstall.sh --purge
          test ! -e /usr/local/bin/ai-server-agent
          test ! -e /usr/local/sbin/ai-server-agent-manage
          test ! -e /usr/local/lib/ai-server-agent
          sudo test ! -e /etc/ai-server-agent
          sudo test ! -e /var/lib/ai-server-agent
          sudo test ! -e /var/log/ai-server-agent
          sudo test ! -e /opt/ai-server-agent
          if id aiagent >/dev/null 2>&1; then
            echo 'purge must remove aiagent account' >&2
            exit 1
          fi
          if getent group aiagent >/dev/null 2>&1; then
            echo 'purge must remove aiagent group' >&2
            exit 1
          fi
          id aiworker >/dev/null
          getent group aiworker >/dev/null
          sudo test -e /srv/ai-workspace/lifecycle-workspace-sentinel
      - name: Legacy bearer migrates without forced rotation
        run: |
          trap 'rc=$?; printf "credential lifecycle acceptance failed at shell line %s (rc=%s)\\n" "$LINENO" "$rc" >&2' ERR
          legacy="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"
          test "${#legacy}" -eq 64
          command -v script >/dev/null
          # Recreate the legacy service identity removed by the preceding
          # purge so this fixture matches a real pre-#43 installed host.
          sudo getent group aiagent >/dev/null 2>&1 || sudo groupadd --system aiagent
          sudo id aiagent >/dev/null 2>&1 || sudo useradd --system --gid aiagent --home /var/lib/ai-server-agent --shell /usr/sbin/nologin aiagent
          sudo install -d -m 0750 -o root -g aiagent /etc/ai-server-agent
          cat >/tmp/legacy-agent-config.json <<'EOF_LEGACY_CONFIG'
          {
            "listen_address": "127.0.0.1:3210",
            "mcp_path": "/mcp",
            "health_path": "/healthz",
            "auth_mode": "bearer",
            "bearer_token_file": "/etc/ai-server-agent/mcp.token",
            "executor_socket": "/run/ai-server-agent/executor.sock",
            "executor_token_file": "/etc/ai-server-agent/executor.token",
            "state_dir": "/var/lib/ai-server-agent",
            "log_dir": "/var/log/ai-server-agent",
            "workspace_dir": "/srv/ai-workspace",
            "worker_user": "aiworker",
            "agent_user": "aiagent"
          }
          EOF_LEGACY_CONFIG
          sudo install -o root -g aiagent -m 0640 /tmp/legacy-agent-config.json /etc/ai-server-agent/config.json
          printf '%s\n' "$legacy" | sudo tee /etc/ai-server-agent/mcp.token >/dev/null
          sudo chown root:aiagent /etc/ai-server-agent/mcp.token
          sudo chmod 0640 /etc/ai-server-agent/mcp.token

          # An ambiguous pre-existing store must fail before replacing the
          # legacy auth source. This exercises migration failure preservation,
          # not only the successful conversion path below.
          legacy_config_before="$(sudo sha256sum /etc/ai-server-agent/config.json | awk '{print $1}')"
          legacy_token_before="$(sudo sha256sum /etc/ai-server-agent/mcp.token | awk '{print $1}')"
          sudo tee /etc/ai-server-agent/mcp-credentials.json >/dev/null <<'EOF_AMBIGUOUS_STORE'
          {"version":1,"credentials":[{"principal":{"id":"direct-default","class":"direct","name":"direct/default"},"verifier_algorithm":"sha256-v1","verifier":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","created_at":"2026-10-08T00:00:00Z","enabled":true}]}
          EOF_AMBIGUOUS_STORE
          if sudo env AI_SERVER_AGENT_BINARY=/tmp/ai-server-agent AI_SERVER_AGENT_NONINTERACTIVE=1 bash install.sh >/tmp/legacy-migration-failure.out 2>&1; then
            echo 'ambiguous legacy migration unexpectedly succeeded' >&2
            exit 1
          fi
          grep -qF 'Refusing ambiguous migration' /tmp/legacy-migration-failure.out
          test "$(sudo sha256sum /etc/ai-server-agent/config.json | awk '{print $1}')" = "$legacy_config_before"
          test "$(sudo sha256sum /etc/ai-server-agent/mcp.token | awk '{print $1}')" = "$legacy_token_before"
          sudo rm -f /etc/ai-server-agent/mcp-credentials.json

          # A failure after config + install-state replacement and unit
          # creation, but before service activation, must restore the legacy
          # config/token and the prior install metadata. Fail daemon-reload
          # exactly once; rollback restart then uses the real systemctl.
          sudo rm -f /tmp/asa-systemctl-failed
          mkdir -p /tmp/asa-test-bin
          cat > /tmp/asa-test-bin/systemctl <<'EOF_STATE_SYSTEMCTL'
          #!/usr/bin/env bash
          if [ "$1" = "daemon-reload" ] && [ ! -e /tmp/asa-systemctl-failed ]; then
            touch /tmp/asa-systemctl-failed
            exit 19
          fi
          exec /usr/bin/systemctl "$@"
          EOF_STATE_SYSTEMCTL
          chmod 0755 /tmp/asa-test-bin/systemctl
          state_before="$(sudo sha256sum /etc/ai-server-agent/control/install-state.json | awk '{print $1}')"
          if sudo env PATH="/tmp/asa-test-bin:$PATH" AI_SERVER_AGENT_BINARY=/tmp/ai-server-agent AI_SERVER_AGENT_NONINTERACTIVE=1 bash install.sh >/tmp/asa-state-failure.out 2>&1; then
            echo 'post-config pre-activation failure unexpectedly succeeded' >&2
            exit 1
          fi
          test -e /tmp/asa-systemctl-failed
          grep -qF 'previous legacy bearer configuration was restored' /tmp/asa-state-failure.out
          test "$(sudo sha256sum /etc/ai-server-agent/config.json | awk '{print $1}')" = "$legacy_config_before"
          test "$(sudo sha256sum /etc/ai-server-agent/mcp.token | awk '{print $1}')" = "$legacy_token_before"
          test "$(sudo sha256sum /etc/ai-server-agent/control/install-state.json | awk '{print $1}')" = "$state_before"
          sudo systemctl is-active --quiet ai-server-agent.service
          sudo rm -rf /tmp/asa-test-bin /tmp/asa-systemctl-failed

          # Now pass the legacy/store verifier precheck but make the named store
          # invalid for the running server. The new service must fail startup,
          # and the installer must restore + verify the legacy auth path.
          legacy_verifier="$(printf '%s' "$legacy" | sha256sum | awk '{print $1}')"
          sudo tee /etc/ai-server-agent/mcp-credentials.json >/dev/null <<EOF_INVALID_ACTIVE_STORE
          {"version":1,"credentials":[{"principal":{"id":"direct-default","class":"direct","name":"direct/default"},"verifier_algorithm":"sha256-v1","verifier":"$legacy_verifier","created_at":"2026-10-08T00:00:00Z","enabled":true},{"principal":{"id":"rogue","class":"gateway","name":"rogue"},"verifier_algorithm":"sha256-v1","verifier":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","created_at":"2026-10-08T00:00:00Z","enabled":true}]}
          EOF_INVALID_ACTIVE_STORE
          if sudo env AI_SERVER_AGENT_BINARY=/tmp/ai-server-agent AI_SERVER_AGENT_NONINTERACTIVE=1 bash install.sh >/tmp/legacy-activation-failure.out 2>&1; then
            echo 'invalid named-store activation unexpectedly succeeded' >&2
            exit 1
          fi
          grep -Eq 'previous legacy bearer configuration was restored|previous config was restored on disk' /tmp/legacy-activation-failure.out
          test "$(sudo sha256sum /etc/ai-server-agent/config.json | awk '{print $1}')" = "$legacy_config_before"
          test "$(sudo sha256sum /etc/ai-server-agent/mcp.token | awk '{print $1}')" = "$legacy_token_before"
          sudo test ! -e /etc/ai-server-agent/mcp-credentials.json
          sudo systemctl is-active --quiet ai-server-agent.service
          rollback_code="$(printf 'header = "Authorization: Bearer %s"\n' "$legacy" | curl -sS --config - -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data '{}' http://127.0.0.1:3210/mcp)"
          test "$rollback_code" != 000
          test "$rollback_code" != 401

          sudo env AI_SERVER_AGENT_BINARY=/tmp/ai-server-agent AI_SERVER_AGENT_NONINTERACTIVE=1 bash install.sh
          instance_id_after_purge="$(sudo jq -er '.instance_id' /etc/ai-server-agent/config.json)"
          [[ "$instance_id_after_purge" =~ ^asa_[0-9a-f]{32}$ ]]
          test "$instance_id_after_purge" != "$instance_id_before"

          sudo test -s /etc/ai-server-agent/mcp-credentials.json
          sudo test ! -e /etc/ai-server-agent/mcp.token
          sudo test ! -e /etc/ai-server-agent/mcp.authorization
          test "$(sudo jq -r '.credentials[] | select(.principal.id=="direct-default") | .verifier' /etc/ai-server-agent/mcp-credentials.json)" = "$(printf '%s' "$legacy" | sha256sum | awk '{print $1}')"
          code="$(printf 'header = "Authorization: Bearer %s"\n' "$legacy" | curl -sS --config - -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data '{}' http://127.0.0.1:3210/mcp)"
          test "$code" != 000
          test "$code" != 401

          # Credential operations and update/uninstall must share the same
          # root lifecycle lock, including direct library invocation.
          lock_ready="$(mktemp)"
          rm -f "$lock_ready"
          sudo bash -c '
            exec 8>>/run/lock/ai-server-agent/management.lock
            flock -x 8
            touch "$1"
            sleep 3
          ' _ "$lock_ready" &
          lock_holder=$!
          for attempt in $(seq 1 30); do
            [ -e "$lock_ready" ] && break
            sleep 0.1
          done
          test -e "$lock_ready"
          if sudo env AI_SERVER_AGENT_MANAGE_LIBRARY_ONLY=1 bash -c '
            source /usr/local/lib/ai-server-agent/manage.sh
            acquire_management_lock
          '; then
            echo 'credential manager bypassed active lifecycle lock' >&2
            exit 1
          fi
          wait "$lock_holder"
          sudo rm -f "$lock_ready"
          sudo env AI_SERVER_AGENT_MANAGE_LIBRARY_ONLY=1 bash -c '
            source /usr/local/lib/ai-server-agent/manage.sh
            acquire_management_lock
          '

          # Rotation is an interactive root-only one-time reveal. Allocate a
          # local pseudo-TTY but discard its transcript/stdout so CI never logs
          # the newly issued bearer. The command itself verifies the new bearer
          # against the live MCP path before returning success.
          run_gateway_rotation(){
            local transcript rc
            transcript="$(mktemp)"
            set +e
            script -qefc "sudo ai-server-agent-manage credential-rotate mcp-gateway" "$transcript" >/dev/null 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              sed -E 's/(Authorization: Bearer )[0-9a-f]+/\\1<redacted>/g' "$transcript" >&2
              rm -f "$transcript"
              return "$rc"
            fi
            rm -f "$transcript"
          }
          run_gateway_rotation
          gateway_v1="$(sudo jq -r '.credentials[] | select(.principal.id=="mcp-gateway") | .verifier' /etc/ai-server-agent/mcp-credentials.json)"
          test -n "$gateway_v1"
          sudo systemctl is-active --quiet ai-server-agent.service

          # A second rotation is the supported recovery when the first reveal
          # is lost. It must replace, not overlap, the selected principal.
          run_gateway_rotation
          gateway_v2="$(sudo jq -r '.credentials[] | select(.principal.id=="mcp-gateway") | .verifier' /etc/ai-server-agent/mcp-credentials.json)"
          test -n "$gateway_v2"
          test "$gateway_v1" != "$gateway_v2"
          test "$(sudo jq '[.credentials[] | select(.principal.id=="mcp-gateway")] | length' /etc/ai-server-agent/mcp-credentials.json)" -eq 1

          # Force activation failure through the library path and prove the
          # on-disk credential store is restored byte-for-byte.
          store_before="$(sudo sha256sum /etc/ai-server-agent/mcp-credentials.json | awk '{print $1}')"
          if sudo env AI_SERVER_AGENT_MANAGE_LIBRARY_ONLY=1 bash -c '
            source /usr/local/lib/ai-server-agent/manage.sh
            systemctl(){ return 1; }
            credential_revoke mcp-gateway
          '; then
            echo 'forced credential activation failure unexpectedly succeeded' >&2
            exit 1
          fi
          store_after="$(sudo sha256sum /etc/ai-server-agent/mcp-credentials.json | awk '{print $1}')"
          test "$store_before" = "$store_after"
          test "$(sudo jq -r '.credentials[] | select(.principal.id=="mcp-gateway") | .enabled' /etc/ai-server-agent/mcp-credentials.json)" = true
          sudo systemctl is-active --quiet ai-server-agent.service

          sudo ai-server-agent-manage credential-revoke mcp-gateway
          test "$(sudo jq -r '.credentials[] | select(.principal.id=="mcp-gateway") | .enabled' /etc/ai-server-agent/mcp-credentials.json)" = false
          test "$(sudo jq -r '[.credentials[] | select(.enabled==true)] | length' /etc/ai-server-agent/mcp-credentials.json)" -eq 1
          sudo systemctl is-active --quiet ai-server-agent.service

          sudo env AI_SERVER_AGENT_YES=1 bash uninstall.sh --purge
          sudo test ! -e /etc/ai-server-agent
          rm -f /tmp/legacy-agent-config.json
      - name: First-run deferral is not an installation failure
        if: ${{ needs.change-scope.outputs.root_trust_security_changed != 'false' }}
        run: |
          command -v script >/dev/null
          printf '0\n' | script -qefc "sudo env AI_SERVER_AGENT_BINARY=/tmp/ai-server-agent bash install.sh" /tmp/first-run.out
          grep -qF 'Setup deferred. The Agent remains installed and healthy in local mode.' /tmp/first-run.out
          grep -qF 'AI Server Agent core installed successfully; connection setup is incomplete.' /tmp/first-run.out
          grep -qF 'sudo ai-server-agent-manage' /tmp/first-run.out
          if grep -qF '[ERROR] Installation failed' /tmp/first-run.out; then
            echo 'safe first-run deferral must not be reported as installation failure' >&2
            exit 1
          fi
          sudo systemctl is-active --quiet ai-server-agent.service
          sudo systemctl is-active --quiet ai-server-agent-executor.service
          sudo env AI_SERVER_AGENT_YES=1 bash uninstall.sh --purge
          id aiworker >/dev/null
          getent group aiworker >/dev/null
          sudo test -e /srv/ai-workspace/lifecycle-workspace-sentinel
      - name: Upload release candidate artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-server-agent-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7


  main-release-artifact:
    name: Exact main release artifact
    needs: change-scope
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.change-scope.result == 'success' && (needs.change-scope.outputs.runtime_changed == 'false' || needs.change-scope.outputs.reuse_validated_pr == 'true') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build exact-SHA release candidate artifact
        run: |
          rm -rf dist
          bash scripts/build-release.sh "$RELEASE_VERSION"
          (cd dist && sha256sum -c SHA256SUMS)
          sudo bash dist/install.sh --check
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-server-agent-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  debian-compatibility:
    needs: change-scope
    # Required per-Debian PR checks still run. On a proven identical main
    # squash, omit the entire three-runner matrix rather than starting empty VMs.
    if: ${{ always() && needs.change-scope.outputs.reuse_validated_pr != 'true' }}
    name: Debian ${{ matrix.version }} stable compatibility
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "11"
            maintained: false
          - version: "12"
            maintained: true
          - version: "13"
            maintained: true
    steps:
      - name: Require successful change classification
        run: test "${{ needs.change-scope.result }}" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.change-scope.outputs.platform_changed != 'false'
      - name: Verify supported Debian host contract
        if: needs.change-scope.outputs.platform_changed != 'false'
        env:
          DEBIAN_MAINTAINED: ${{ matrix.maintained }}
        run: |
          docker run --rm \
            -e DEBIAN_MAINTAINED \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            "debian:${{ matrix.version }}" \
            bash -lc '
              set -Eeuo pipefail
              cd /repo
              if [ "$DEBIAN_MAINTAINED" = true ]; then
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                  ca-certificates curl jq openssl tar xz-utils util-linux systemd >/dev/null
                AI_SERVER_AGENT_VERSION=v0.1.9 bash install.sh --check
              else
                test "$(. /etc/os-release; printf %s "$ID")" = debian
                test "$(. /etc/os-release; printf %s "$VERSION_ID")" = 11
                bash install.sh --check-platform debian 11 "$(uname -m)"
              fi
              bash tests/platform_compatibility.sh
            '

  arm64-lifecycle:
    needs: change-scope
    if: ${{ always() && needs.change-scope.outputs.reuse_validated_pr != 'true' && (needs.change-scope.result != 'success' || needs.change-scope.outputs.go_changed != 'false' || needs.change-scope.outputs.platform_changed != 'false' || needs.change-scope.outputs.arm64_lifecycle_changed != 'false') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Require successful change classification
        run: test "${{ needs.change-scope.result }}" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Native arm64 build and tests
        run: |
          test "$(uname -m)" = 'aarch64'
          go test ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/ai-server-agent ./cmd/ai-server-agent
          bash tests/platform_compatibility.sh
          sudo bash install.sh --check
      - name: Native arm64 lifecycle validation
        if: needs.change-scope.outputs.arm64_lifecycle_changed != 'false'
        run: |
          sudo env AI_SERVER_AGENT_BINARY=/tmp/ai-server-agent AI_SERVER_AGENT_NONINTERACTIVE=1 bash install.sh
          sudo systemctl is-active --quiet ai-server-agent.service
          sudo systemctl is-active --quiet ai-server-agent-executor.service
          sudo jq -e '.channel == "source" and .version == "source"' /etc/ai-server-agent/control/install-state.json >/dev/null
          sudo bash tests/root_trust_boundary.sh
      - name: Cleanup arm64 test installation
        if: ${{ always() && needs.change-scope.result == 'success' && needs.change-scope.outputs.arm64_lifecycle_changed != 'false' }}
        run: sudo env AI_SERVER_AGENT_YES=1 bash uninstall.sh --purge || true
