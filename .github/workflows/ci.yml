name: CI
on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-once:
    if: github.head_ref == 'fix/rulesets-contract-v014'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rulesets-contract-v014
          fetch-depth: 0
      - name: Apply root-cause patch and targeted validation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-rulesets-root-fix.py
          echo '== shell syntax =='
          bash -n manage.sh tests/cloudflare_rulesets_pagination.sh
          echo '== rulesets contract =='
          bash tests/cloudflare_rulesets_pagination.sh
          echo '== transaction rollback =='
          bash tests/cloudflare_transaction.sh
          echo '== crash recovery =='
          bash tests/cloudflare_crash_recovery.sh
          echo '== diff check =='
          git diff --check
      - name: Restore trusted CI, remove one-shot tooling, and push candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          sed -i 's/RELEASE_VERSION: v0.1.3/RELEASE_VERSION: v0.1.4/' .github/workflows/ci.yml
          test "$(grep -Fc 'RELEASE_VERSION: v0.1.4' .github/workflows/ci.yml)" -eq 1
          git rm .github/workflows/apply-rulesets-root-fix.yml scripts/apply-rulesets-root-fix.py
          git add manage.sh tests/cloudflare_rulesets_pagination.sh .github/workflows/ci.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: align Rulesets discovery with Cloudflare contract'
          git push origin HEAD:fix/rulesets-contract-v014
