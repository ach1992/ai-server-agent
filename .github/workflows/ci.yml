name: CI
on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-once:
    if: github.head_ref == 'fix/cloudflare-rulesets-contract-v2'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-rulesets-contract-v2
          fetch-depth: 0
      - name: Apply ownership-drift fixes and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-review-findings-v2.py
          bash -n manage.sh tests/cloudflare_rulesets_pagination.sh tests/cloudflare_transaction.sh tests/cloudflare_crash_recovery.sh tests/cloudflare_phase_recovery.sh
          bash tests/cloudflare_rulesets_pagination.sh
          sudo bash tests/cloudflare_transaction.sh
          sudo bash tests/cloudflare_crash_recovery.sh
          sudo bash tests/cloudflare_phase_recovery.sh
          git diff --check
      - name: Restore trusted CI and push corrected candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          text = p.read_text()
          old = '  RELEASE_VERSION: v0.1.3\n'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one v0.1.3 release target in trusted CI')
          p.write_text(text.replace(old, '  RELEASE_VERSION: v0.1.4\n', 1))
          PY
          rm -f scripts/apply-review-findings.py scripts/apply-review-findings-v2.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manage.sh tests/cloudflare_rulesets_pagination.sh tests/cloudflare_transaction.sh .github/workflows/ci.yml scripts/apply-review-findings.py scripts/apply-review-findings-v2.py
          git commit -m 'fix: preserve Cloudflare rule ownership under drift'
          git push origin HEAD:fix/cloudflare-rulesets-contract-v2
