name: Apply v0.1.2 Cloudflare write-unknown hardening
on:
  push:
    branches: [feat/v0.1.2-stable-install-cloudflare]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Run temporary Cloudflare write-unknown hardening'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.1.2-stable-install-cloudflare
          fetch-depth: 0
      - name: Apply and validate hardening
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/fix-v012-write-unknown-applicator.py scripts/apply-v012-cloudflare-write-unknown.py
          python3 scripts/fix-v012-write-unknown-applicator.py
          python3 scripts/apply-v012-cloudflare-write-unknown.py
          bash -n manage.sh tests/cloudflare_transaction.sh
          sudo bash tests/cloudflare_transaction.sh
          git diff --check
      - name: Commit product changes
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manage.sh tests/cloudflare_transaction.sh
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Recover ambiguous Cloudflare writes safely'
          git push origin HEAD:feat/v0.1.2-stable-install-cloudflare
