name: Apply v0.1.2 root working-directory hardening
on:
  push:
    branches: [feat/v0.1.2-stable-install-cloudflare]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply root working-directory hardening'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.1.2-stable-install-cloudflare
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Apply and validate root CWD hardening
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/.tmp-root-cwd-hardening.py
          python3 scripts/.tmp-root-cwd-hardening.py
          gofmt -w internal/executor/executor.go internal/executor/executor_test.go
          go test -race ./internal/executor
          sudo env PATH="$PATH" go test ./internal/executor -run TestRootCommandAndJobIgnoreWorkerStartupFiles -count=1
          git diff --check
      - name: Commit non-workflow product changes
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/.tmp-root-cwd-hardening.py
          git add internal/executor/executor.go internal/executor/executor_test.go
          git diff --cached --check
          git commit -m 'Isolate root command working directory'
          git push origin HEAD:feat/v0.1.2-stable-install-cloudflare
