name: Apply v0.1.2 final security remediation
on:
  push:
    branches: [feat/v0.1.2-stable-install-cloudflare]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Run final security remediation'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.1.2-stable-install-cloudflare
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Apply and validate final security remediation
        run: |
          set -Eeuo pipefail
          {
            head -n -1 scripts/.tmp-final-security.part1
            cat \
              scripts/.tmp-final-security.part2 \
              scripts/.tmp-final-security.part3 \
              scripts/.tmp-final-security.part4 \
              scripts/.tmp-final-security.part5 \
              scripts/.tmp-final-security.part6 \
              scripts/.tmp-final-security.part7 \
              scripts/.tmp-final-security.part8 \
              scripts/.tmp-final-security.part9 \
              scripts/.tmp-final-security.part10 \
              scripts/.tmp-final-security.part11
          } > /tmp/apply-final-security.py
          python3 -m py_compile /tmp/apply-final-security.py
          python3 /tmp/apply-final-security.py
          chmod +x tests/cloudflare_transaction.sh tests/cloudflare_crash_recovery.sh tests/cloudflare_phase_recovery.sh tests/root_trust_boundary.sh tests/root_trust_migration.sh
          gofmt -w internal/executor/executor.go internal/executor/executor_test.go
          bash -n install.sh update.sh uninstall.sh manage.sh scripts/build-release.sh tests/cloudflare_transaction.sh tests/cloudflare_crash_recovery.sh tests/cloudflare_phase_recovery.sh tests/root_trust_boundary.sh tests/root_trust_migration.sh
          go test -race ./...
          sudo env PATH="$PATH" go test ./internal/executor -run TestRootCommandAndJobIgnoreWorkerStartupFiles -count=1
          sudo bash tests/cloudflare_transaction.sh
          sudo bash tests/cloudflare_crash_recovery.sh
          sudo bash tests/cloudflare_phase_recovery.sh
          git diff --check
      - name: Commit non-workflow product changes and bridge workflow outputs
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp .github/workflows/ci.yml scripts/.final-ci.yml
          cp .github/workflows/security.yml scripts/.final-security.yml
          git restore --source=HEAD -- .github/workflows/ci.yml .github/workflows/security.yml
          git rm \
            scripts/.tmp-final-security.part1 \
            scripts/.tmp-final-security.part2 \
            scripts/.tmp-final-security.part3 \
            scripts/.tmp-final-security.part4 \
            scripts/.tmp-final-security.part5 \
            scripts/.tmp-final-security.part6 \
            scripts/.tmp-final-security.part7 \
            scripts/.tmp-final-security.part8 \
            scripts/.tmp-final-security.part9 \
            scripts/.tmp-final-security.part10 \
            scripts/.tmp-final-security.part11
          git add manage.sh internal/executor/executor.go internal/executor/executor_test.go tests/cloudflare_transaction.sh tests/cloudflare_crash_recovery.sh tests/cloudflare_phase_recovery.sh docs/ARCHITECTURE.md scripts/.final-ci.yml scripts/.final-security.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Harden privileged execution and Cloudflare recovery'
          git push origin HEAD:feat/v0.1.2-stable-install-cloudflare
