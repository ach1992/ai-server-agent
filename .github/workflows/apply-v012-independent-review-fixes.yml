name: Apply v0.1.2 independent review fixes
on:
  push:
    branches: [feat/v0.1.2-stable-install-cloudflare]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Run temporary v0.1.2 independent-review fixes'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.1.2-stable-install-cloudflare
          fetch-depth: 0
      - name: Apply reviewed fixes
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/apply-v012-independent-review-fixes.py scripts/apply-v012-trap-fallback.py
          python3 scripts/apply-v012-independent-review-fixes.py
          python3 scripts/apply-v012-trap-fallback.py
          bash -n install.sh update.sh manage.sh tests/cloudflare_transaction.sh scripts/build-release.sh
          sudo bash tests/cloudflare_transaction.sh
          git diff --check
      - name: Commit product changes
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install.sh update.sh manage.sh tests/cloudflare_transaction.sh
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Fix v0.1.2 independent review blockers'
          git push origin HEAD:feat/v0.1.2-stable-install-cloudflare
